name: Render Song Screenshots

on:
  workflow_dispatch:
    inputs:
      song_scene:
        description: 'Scene path to render'
        required: false
        default: 'res://tools/holyquintet/level_shot.tscn'
        type: string

env:
  GODOT_VERSION: '4.7.1-stable'

jobs:
  render:
    name: Render Song
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive
          ref: holyquintet-port

      - name: Cache Godot binary
        id: cache-godot-bin
        uses: actions/cache@v4
        with:
          path: /opt/godot
          key: godot-bin-${{ runner.os }}-${{ env.GODOT_VERSION }}

      - name: Download Godot binary
        if: steps.cache-godot-bin.outputs.cache-hit != 'true'
        run: |
          mkdir -p /opt/godot
          wget -q https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}/Godot_v${{ env.GODOT_VERSION }}_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /opt/godot
          chmod +x /opt/godot/Godot_v${{ env.GODOT_VERSION }}_linux.x86_64
          rm /tmp/godot.zip
          ln -sf /opt/godot/Godot_v${{ env.GODOT_VERSION }}_linux.x86_64 /opt/godot/godot

      - name: Import Godot project
        run: |
          rm -rf .godot/imported
          /opt/godot/godot --headless --import 2>&1
          sleep 5

      - name: Render song screenshots
        run: |
          mkdir -p /tmp/hq_renders
          timeout 300 xvfb-run -a --server-args="-screen 0 1920x1080x24" \
            /opt/godot/godot --path . --rendering-driver opengl3 \
            ${{ inputs.song_scene }} 2>&1 || true
          ls -la /tmp/hq_renders/ || echo "No renders found"

      - name: Upload render screenshots
        uses: actions/upload-artifact@v4
        with:
          name: song-renders
          path: /tmp/hq_renders/*.png
          retention-days: 7
          compression-level: 1
