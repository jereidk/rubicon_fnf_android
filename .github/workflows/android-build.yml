          guard_godot tools/test_load_progress.gd

          # === Verify SKILLISSUE really switches the mechanics off
          # Six pieces in six files and every joint fails silently. The one
          # that matters: a mechanic can simply never consult the setting, and
          # then the code works, the checkbox appears, it saves, it loads, and
          # the mechanic starts anyway with nothing reporting a problem. Each
          # of the three is checked at the exact entry point its song's
          # timeline drives, and named so a red line says which song lost its
          # opt-out.
          guard_godot tools/test_no_mechanics.gd

          # === Verify no .tscn declares a node before its parent
          # Chimera's PreludeCaption did: parent="UILayer" at line 14863, with
          # UILayer declared at 14955. Godot resolves a parent against nodes it
          # has already built, so the caption was dropped from the tree and the
          # song's story cards silently stopped appearing. The only trace was
          # two "couldn't resolve track" warnings in a render log, and the
          # missing text read as the video's overlay exclusion working.
          guard_godot tools/test_scene_node_order.gd

          # === Verify the art the cutscene videos replaced is still here
          # Only qol_low and qol_very_low ask for video; Medium and up run the
          # live cutscene, so those sprites are the path most players are on,
          # not the old one. Deleting them raises nothing - the video node just
          # does not engage and the scene draws nothing. The videos being
          # SMALLER than the art they stand in for (6.7 MB against 17.6) is
          # exactly what makes deleting it look like a free win.
          guard_godot tools/test_cutscene_assets_kept.gd

          # === Verify the console's boot flag always clears
          # booting gates back_out, home_button, gallery_button and
          # cartridges_enter_label, and its only clear used to require a frame
          # landing between 13.34s and the end of the boot animation. A frame
          # that steps over that window strands it true for the life of the
          # scene and the whole console stops responding. This project has
          # frames seconds long.
          guard_godot tools/test_console_boot_flag.gd

          # === Verify a blackout shorter than the census is still logged
          # The census names a full-screen black rect when it sees one, but it
          # samples every 30 seconds - and the reported Chimera bug is a black
          # graphic that comes and goes during a song. A 40 second visit
          # produced two censuses, both reading opaque=[], while the player
          # was watching it happen. The instrument was asleep, not wrong.
          guard_godot tools/test_blackout_watch.gd

          # === Verify the frame timer measures the frame
          # Godot's process delta is smoothed and clamped: measured against
          # this build, a 5000ms frame arrives as 66.7ms. Every frame-shape
          # number the log produces was shaped from it, which is how a device
          # log came back reporting worst=166.7ms for a session containing a
          # measured 11,489ms frame. The test blocks the thread, because delta
          # is accurate at 60fps - exactly when nobody needs it to be.
          guard_godot tools/test_frame_clock.gd

          # === Verify gpu= admits when the driver does not answer
          # viewport_get_measured_render_time_gpu returns 0.00 forever on some
          # drivers - the moto g(60)s (Mali-G76, driver 1.1.131) does it for
          # all 492 entries of one log, with cpu_render varying normally next
          # to it. A zero reads as a free frame, which is the opposite of the
          # truth, and every cross-device comparison in this project leans on
          # gpu=. The discriminator is the pair, not the lone zero: across the
          # project's 33 logs the longest run of (gpu == 0 and cpu_render > 0)
          # is 492 on that device and 0 on the other five models.
          guard_godot tools/test_gpu_timing_latch.gd

          # === Verify the trance-shader gate cannot hide anything visible
          # Safety Lullaby's WaterEffect and RadialEffect are full-screen
          # ColorRects on hint_screen_texture, and both shaders have an
          # identity branch that is their default state - the parameters all
          # come from (100 - retention)/100, which is 0 while the player holds
          # the pendulum. Measured on the phone's path (Vulkan, Forward
          # Mobile): the identity pass costs 13.3ms of a 20ms frame, three
          # times everything under it, and hiding the rect takes the engine's
          # backbuffer copy with it (draws 2 -> 1). The gate cuts at
          # NEUTRAL_EPSILON; this pins that constant under the half-a-step
          # bound its own derivation gives (0.0071), which is the part that
          # can drift in silence.
          guard_godot tools/test_trance_gate.gd

          # === Verify Reduce Visual Effects reaches a mesh-resource material
          # The stripper read material_override and the surface overrides -
          # both node-owned - and never the material set on the mesh resource.
          # Chimera's Ray box is exactly that, carrying shd_godrays: unshaded,
          # blend_add, cull_disabled, depth_test_disabled, so both faces are
          # rasterised with no depth rejection and a depth-texture sample per
          # fragment. Measured at 800x360 (the g53's 3D pass at scale=0.50):
          # one extra draw call and twelve primitives take 3.88ms to 8.05ms.
          # Inert on all four presets - only Custom with post=High reaches it -
          # so this is a correctness gate, not a win.
          guard_godot tools/test_effect_mesh_hide.gd

          # === Verify the light-energy gate and its audit tool's default
          # Forward Mobile evaluates every light that reaches a fragment, so a
          # light at energy=0 still costs full price and only visible=false
          # removes it. This gate is opt-in per node (attaching it needs a
          # human to check tools/audit_light_cost.py first, not an automatic
          # scene-wide pass) - what this pins is the gate's own behaviour and
          # a real bug the audit tool had: it read a missing light_energy
          # property line as 0.0, when Godot's own default is 1.0, and flagged
          # an ordinary light (the shop's LightbulbLight) as dead cost.
          guard_godot tools/test_light_energy_gate.gd

          # === Verify the retained-resource sweep stays cheap
          # The sweep runs on the main thread during a load, next to a loading
          # screen this project spent real effort keeping animated. Its first
          # version treated a directory listing as free inside a budgeted loop
          # and blew 2ms to 358ms in one frame - destroying the thing it was
          # added to explain. The bound is checked against the real project,
          # not a fixture.
          guard_godot tools/test_retained_sweep.gd

          # === Verify the UI localization CSV resolves and falls back correctly
          # Godot auto-translates a Control's text/tooltip against whatever
          # TranslationServer.set_locale() is set to, keyed on the literal
          # English string authored in the .tscn - so the CSV at
          # lullaby_mod/resources/localization/ui_strings.csv never needed a
          # single .tscn edited, only an "es" column. This pins that the
          # generated ui_strings.es.translation actually loads (project.godot
          # points at the .translation, not the source .csv - pointing at the
          # .csv silently loads nothing), that known keys resolve under "es",
          # and that locale "en" (or any locale with no translation) falls
          # straight back to the authored English text rather than erroring.
          guard_godot tools/test_localization.gd

          # === Verify the Codes home icon still changes colour when selected
          # The kind of bug a test normally misses: the button was wired
          # correctly and did swap materials on focus - the two materials just
          # looked the same. Every other icon swaps between two different
          # gradient textures (grey-beige vs a white-to-red ramp); the keyboard
          # icon is a flat quad with its own texture, and its "selected"
          # material was that same texture at albedo_color 1.3 - a brightness
          # bump with no hue shift, so the icon read as dead when focused.
          # This pins that idle and select differ by a real shift toward red.
          guard_godot tools/test_console_icon_select_tint.gd

          # === Verify the three Training drills are actually playable
          # Each mechanic is normally driven by its own song's scene animation
          # and the Training host only replaced part of what that animation
          # does, so all three built cleanly and none of them worked: the
          # pendulum was never revealed (the song drives `dropped` as well as
          # `started`), the heart sat at (0,0) with its ECG line off-screen,
          # and the typing challenge kept its authored time_end = 0.0, which
          # makes both of its entry points return on their own deadline guard
          # - no word, no unowns, no timer. On top of that the test level's
          # only touch node is a bare Control, so nothing on a phone produced
          # the `lullaby_special` two of them read, and typing had no keyboard.
          # None of that is visible to a parse check or to either scene sweep;
          # every one of them is a value a script has to write at runtime.
          guard_godot tools/test_training_setup.gd

          # === Verify the per-fragment light counter tells the truth
          # `luz=Nalcanzan` is what prices Chimera's frame: Forward Mobile
          # evaluates every light reaching a fragment in that fragment's
          # shader, measured here at ~15ms per light over a full 1600x720,
          # and two device logs put Chimera's slope at 90.8 ms/Mpx of 3D -
          # which is where that curve puts five or six lights. It was
          # reading 6 against a real 4, both extras being lights the GPU
          # never draws: an editor_only one, and one inside another
          # viewport's world.
          guard_godot tools/test_light_reach_counter.gd

          # === Verify the first-boot screen's language and intro options
          # Three rows the player meets before anything else: the UI
          # language, "skip the Collector's introduction" (shown only while
          # that welcome has never played) and "always play the Collector's
          # introduction" (always shown). Every one of them is a runtime
          # write to a Setting or a SaveData flag, so none of it is visible
          # to a parse check or to either scene sweep. This also pins that
          # forcing is a Setting rather than just clearing intro_seen -
          # that flag doubles as EntryVoicelines' "are you a returning
          # visitor", so clearing it would mute the entry voicelines.
          guard_godot tools/test_first_boot_options.gd

          # === Verify hardcoded uid:// references resolve
          # Catches the collector-shop crash class before it ships: a bare
          # "uid://..." string literal in .gd code (SceneChanger.change_to,
          # preload, change_scene_to_file - no res:// path to fall back to,
          # unlike a normal ext_resource) that doesn't resolve against
          # .godot/uid_cache.bin. This has shipped silently before because
          # nothing checked it - the Import step's own log stays clean even
          # when this is broken, and it only surfaces as a runtime crash on
          # whatever menu action actually triggers that specific reference.
          # See tools/verify_hardcoded_uids.gd for what this doesn't catch
          # (ext_resource uid mismatches - those degrade gracefully to a
          # text-path fallback instead of crashing, so they're a quality
          # issue, not a build-breaking one).
          guard_godot_exit tools/verify_hardcoded_uids.gd --no-path
          if [ ${#failed[@]} -ne 0 ]; then
            echo
            echo "::error::${#failed[@]} guard(s) failed:"
            for f in "${failed[@]}"; do echo "::error::  $f"; done
            exit 1
          fi
          echo
          echo "all $ran guards passed"

      # Renderiza una cutscene real a .ogv, para que LullabyCutsceneVideo tenga
      # con qué sustituirla en los presets bajos.
      #
      # Vive aqui dentro y no en un job aparte porque lo caro ya esta pago en
      # este job: el checkout con LFS, el binario de Godot y sobre todo el
      # import. Un job propio tendria que repetir esos ~150 lineas de setup, y
      # el import en frio es exactamente lo que hace inviable renderizar esto a
      # mano - se atasca mas de cuatro minutos en chimera_base.exr solo, antes
      # de llegar a las ~124 texturas ASTC que tardan mas de una hora. Mismo
      # patron que precompile_match, que tambien es un paso opcional de este
      # job en vez de un workflow suelto.
      #
      # El resultado sube como artefacto y NO se commitea: un .ogv de la intro
      # entera son un par de megas, y meterlo en el repo es una decision del
      # operador, no un efecto secundario de haber pulsado el boton.
      - name: Render a cutscene to video
        if: inputs.render_cutscene != ''
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg xvfb
          mkdir -p builds/cutscene

          # El .avi de Movie Maker es enorme (crudo): ~46MB por cada 20s. Se
          # queda fuera de builds/ para no acabar en el artefacto.
          raw=/tmp/cutscene_raw.avi

          # El msaa por defecto se anade aqui, no en el harness.
          #
          # render_cutscene.gd deja `_msaa` vacio a proposito y su docstring
          # explica por que: apagar el MSAA a espaldas de quien pide una
          # captura es justo lo que `preset=High` existe para evitar. Ese
          # argumento sigue en pie para el harness. Pero en CI el rasterizador
          # es por software y el video se entrega escalado a 960 desde 1366, y
          # ahi el MSAA es coste puro - asi que el valor va en un input, con su
          # razon escrita, visible en la interfaz y sobreescribible. Explicito,
          # no silencioso.
          #
          # Y solo si quien lanza no lo dijo ya: el harness deja ganar al
          # ultimo `msaa=` que lee, asi que anadirlo siempre le quitaria el
          # mando al argumento escrito a mano.
          args='${{ inputs.render_cutscene }}'
          msaa='${{ inputs.cutscene_msaa }}'
          case " $args " in
            *" msaa="*) : ;;
            *) [ -n "$msaa" ] && args="$args msaa=$msaa" ;;
          esac
          echo "harness: $args"

          # Sin `set -e` alrededor de xvfb-run: interesa el log completo aunque
          # el harness salga con error, porque sus mensajes OUT/printerr son el
          # diagnostico. El fallo se comprueba abajo, sobre el fichero.
          set +e
          xvfb-run -a -s "-screen 0 1920x1080x24" "$GODOT" \
            --path . --rendering-driver opengl3 --rendering-method gl_compatibility \
            --write-movie "$raw" --fixed-fps "${{ inputs.cutscene_fps }}" --disable-vsync \
            res://tools/harness/render_cutscene.tscn \
            -- $args 2>&1 | tee /tmp/render.log
          set -e

          # Un recurso que no cargo deja la captura sin valor: la escena
          # renderiza igual, con huecos. Es el mismo criterio que scene_shot.gd
          # ya documenta - "if anything failed to load, the capture is not
          # evidence" - y por eso esto falla en vez de subir un video malo.
          if grep -qE "referenced non-existent resource|Failed loading resource" /tmp/render.log; then
            echo "::error::faltan recursos en el import; la captura no vale"
            grep -E "referenced non-existent resource|Failed loading resource" /tmp/render.log | head -20
            exit 1
          fi
          if grep -q "couldn't resolve track" /tmp/render.log; then
            echo "::warning::hay pistas sin resolver - revisa que el montaje sea el del juego"
            grep "couldn't resolve track" /tmp/render.log | head -10
          fi
          if [ ! -s "$raw" ]; then
            echo "::error::Movie Maker no escribio nada"
            exit 1
          fi

          width='${{ inputs.cutscene_scale }}'
          quality='${{ inputs.cutscene_quality }}'
          out=builds/cutscene/cutscene.ogv
          # El recorte de cabecera, que es lo que hace posible un video del
          # MEDIO de una cancion.
          #
          # desde= no sirve para una entrega: seek() no despacha los clips que
          # llevan el estado visible, y la corrida #191 lo demostro entregando
          # el HUD sobre negro absoluto (ver el docstring de `_from` en
          # render_cutscene.gd). Asi que la unica via es renderizar desde 0 y
          # tirar la cabecera aqui.
          #
          # Que eso sea asumible se midio antes de construirlo, sobre los 2078
          # latidos de la corrida #189: el coste por frame es PLANO - 5154
          # ms/frame sobre pantalla negra contra 5165 en la intro, un 0.2% de
          # dispersion - porque la casa 3D se dibuja desde el segundo cero y el
          # prelude son overlays encima. Renderizar 53 segundos que se van a
          # tirar cuesta exactamente lo que cuesta cualquier otro tramo, y eso
          # es lo que hace que la cuenta salga en vez de ser un desperdicio
          # imposible de estimar.
          #
          # -ss ANTES de -i para que ffmpeg salte por indice en vez de
          # decodificar y descartar.
          recorte='${{ inputs.cutscene_trim }}'
          corte=""
          if [ -n "$recorte" ] && [ "$recorte" != "0" ]; then
            corte="-ss $recorte"
            echo "recortando los primeros ${recorte}s del render"
          fi

          # -2 en la altura: par, que es lo que yuv420p necesita.
          #
          # La calidad va alta a proposito. Medido sobre el decodificador del
          # motor a 1600x720, q5/q7/q9 cuestan 22.62/23.46/22.60 CPU-segundos
          # sobre los mismos 2400 decodes: ruido. Comprimir mejor cuesta bytes
          # y cero milisegundos de reproduccion, asi que no hay razon para
          # escatimar. El ancho es el que cuesta frame time, no esto.
          ffmpeg -y -loglevel error $corte -i "$raw" \
            -vf "scale=${width}:-2" -c:v libtheora -q:v "$quality" -an "$out"

          # Movie Maker escribe el audio a un .wav hermano cuando la escena
          # suena. Va aparte a proposito: el video no lleva pista de audio
          # (-an), porque la cancion la reproduce el juego y meter una segunda
          # copia dentro del .ogv seria una fuente de desincronizacion.
          if [ -f "${raw%.avi}.wav" ]; then
            cp "${raw%.avi}.wav" builds/cutscene/cutscene_reference.wav
          fi

          echo "=== resultado ==="
          ffprobe -v error -show_entries stream=width,height,nb_frames \
            -show_entries format=duration,size -of default=nw=1 "$out"
          ls -lh builds/cutscene/

          # Que dure lo que se pidio.
          #
          # Esto faltaba y ya dejo pasar un render malo en verde: la corrida
          # #188 pidio Chimera y entrego 2.03 segundos - `hasta=2`, cuando el
          # prelude termina en 15.9333 segun DOS pistas independientes
          # (`../Prelude:visible` a false en 15.9333 y
          # `../UILayer/PreludeCaption:modulate` a alfa 0 en 15.9334). El paso
          # salio success, subio el artefacto, y nadie se entero hasta abrir el
          # fichero.
          #
          # El guard de fotogramas en blanco de abajo no lo pilla, y no es un
          # descuido suyo: muestrea a fps=1/4, asi que un clip de 2 segundos da
          # UNA muestra, y `minimo = max(1, ceil(1/3))` es 1. Un solo fotograma
          # con imagen aprueba el video entero. Ese guard responde "se dibujo
          # algo?"; este responde "se dibujo todo?", y hacen falta los dos.
          #
          # `hasta=` se lee del mismo argumento que se le paso al harness, no de
          # una constante, para que no pueda haber dos verdades que diverjan. Si
          # no viene, el default del harness es 5.0 (`var _until: float = 5.0`).
          pedido=$(printf '%s\n' $args | sed -n 's/^hasta=//p' | tail -1)
          pedido=${pedido:-5.0}
          # `desde=` corre el punto de partida, asi que lo entregado es
          # hasta-desde y no hasta. Sin esto el guard suspende toda sonda: el
          # harness para cuando `_elapsed` -que arranca EN `desde`- alcanza
          # `hasta`, o sea que `desde=54 hasta=56` da dos segundos de video
          # contra un `pedido` de 56.
          desde=$(printf '%s\n' $args | sed -n 's/^desde=//p' | tail -1)
          desde=${desde:-0}
          # El recorte se resta igual que `desde=`: los dos mueven el principio
          # de lo entregado, uno en el harness y el otro en ffmpeg.
          desde=$(python3 -c "print(float('${desde}') + float('${recorte:-0}' or 0))")
          duracion=$(ffprobe -v error -show_entries format=duration \
            -of default=nw=1:nk=1 "$out")
          python3 - "$pedido" "$duracion" "$desde" <<'PY'
          import sys
          pedido, duracion = float(sys.argv[1]), float(sys.argv[2])
          desde = float(sys.argv[3])
          if desde > 0.0:
              pedido = max(pedido - desde, 0.0)
              print(f"sonda desde {desde:.3f}s: se esperan {pedido:.3f}s de video")
          # Un frame de margen y un poco mas: el harness corta en el primer
          # frame cuyo _elapsed pasa de _until, asi que sobra hasta 1/fps. Con
          # hasta=2 a 60fps salieron 122 frames = 2.0333s.
          margen = 0.5
          print(f"pedido {pedido:.3f}s  entregado {duracion:.3f}s  margen {margen}s")
          if abs(duracion - pedido) > margen:
              print(f"::error::el video dura {duracion:.2f}s y se pidieron "
                    f"{pedido:.2f}s - render truncado, no se sube como bueno")
              sys.exit(1)
          print("ok - la duracion cuadra con hasta=")
          PY

          # Que los numeros cuadren no prueba que se vea nada: 32.7 segundos de
          # negro perfecto tienen la misma duracion, el mismo tamano de cuadro y
          # pesan menos. Asi que se muestrean fotogramas y se mide si tienen
          # contenido, y ademas se suben como PNG para poder mirarlos de un
          # vistazo sin descargar y reproducir un video.
          #
          # El umbral es deliberadamente flojo: la intro ARRANCA en negro a
          # proposito - UILayer/Fade tapa la pantalla el primer segundo y
          # BlackFadeIn otros cinco - asi que exigir contenido en todos los
          # fotogramas darian rojos falsos. Lo que se exige es que ALGUNOS
          # tengan imagen de verdad, que es lo que distingue "renderizo" de
          # "no renderizo".
          # El ritmo de muestreo sale de la duracion, no es fijo.
          #
          # Era `fps=1/4` -una muestra cada cuatro segundos- y eso hacia el
          # guard INCAPAZ de comprobar cualquier video de menos de 4s: sobre el
          # clip de 2.017s de la corrida #190 saco cero muestras y el paso
          # murio con "no se pudo muestrear ni un fotograma", que suena a video
          # roto cuando lo roto era el muestreador. Y los videos cortos son
          # justo los que se usan para sondear el coste de un render antes de
          # gastar horas en el largo.
          #
          # Ocho muestras repartidas, dure lo que dure: 8/duracion frames por
          # segundo. Un clip de 2s se muestrea a ~4fps y uno de 35s a ~0.23fps,
          # y los dos dan ocho imagenes.
          #
          # Sin suelo, y el primer intento lo llevaba: `max(0.5, 8/duracion)`
          # parece prudente y hace justo lo contrario de lo que dice el parrafo
          # de arriba - sobre 35 segundos el suelo gana y saca diecisiete
          # muestras en vez de ocho. Un ritmo bajo no es un problema para
          # ffmpeg; el unico caso raro es una duracion diminuta, y para eso
          # basta con no dividir por cero.
          ritmo=$(python3 -c "print(8.0/max(float('$duracion'), 0.1))")
          echo "muestreando a ${ritmo} fps sobre ${duracion}s"
          ffmpeg -y -loglevel error -i "$out" \
            -vf "fps=${ritmo},scale=320:-2" builds/cutscene/muestra_%02d.png
          python3 - <<'PY'
          import glob, sys
          import numpy as np
          from PIL import Image

          shots = sorted(glob.glob("builds/cutscene/muestra_*.png"))
          if not shots:
              print("::error::no se pudo muestrear ni un fotograma")
              sys.exit(1)

          vivos = 0
          for p in shots:
              a = np.asarray(Image.open(p).convert("L"), dtype=np.float32)
              media, desv = a.mean(), a.std()
              marca = ""
              if desv > 8.0:
                  vivos += 1
                  marca = "  <- con imagen"
              print(f"  {p.split('/')[-1]}  luma={media:6.2f}  desv={desv:6.2f}{marca}")

          # Un tercio de las muestras, con suelo de 1: proporcional en vez de un
          # numero fijo, porque un minimo absoluto de 3 suspenderia un clip por
          # ser corto y no por estar en blanco. Ahora el muestreador siempre
          # saca ocho, asi que el minimo es 3 en la practica - la
          # proporcionalidad se queda porque sigue siendo lo correcto si algun
          # dia el ritmo vuelve a depender de la duracion.
          # Comprobado sobre dos videos reales: negro puro da desviacion 0.0 en
          # las ocho muestras, el render de verdad da 26.6.
          minimo = max(1, -(-len(shots) // 3))
          print(f"{vivos} de {len(shots)} fotogramas con imagen (hacen falta {minimo})")
          if vivos < minimo:
              print("::error::el video esta practicamente en blanco - "
                    "la escena no se dibujo")
              sys.exit(1)
          PY

      - name: Upload rendered cutscene
        if: inputs.render_cutscene != ''
        uses: actions/upload-artifact@v4
        with:
          name: cutscene-ogv
          path: builds/cutscene/
          if-no-files-found: error

      - name: Create builds directory
        run: |
          mkdir -p builds

      - name: Bump Android version code
        run: |
          # version/code must strictly increase for Android to accept an APK
          # as a valid update over whatever is already installed (a build
          # signed identically but with an equal/lower versionCode fails with
          # INSTALL_FAILED_VERSION_DOWNGRADE unless the installer passes -d).
          # The workflow run number always increases run over run, so it's a
          # simple monotonic source - offset it well above the manually-set
          # value in export_presets.cfg so it never collides with it.
          NEW_CODE=$((10000 + ${{ github.run_number }}))
          sed -i "s/^version\/code=.*/version\/code=${NEW_CODE}/" export_presets.cfg
          echo "version/code set to ${NEW_CODE}"

          # And stamp the same build into project.godot, which is a different
          # file: the diagnostics log reads application/config/version out of
          # ProjectSettings, and nothing had ever written it, so every log
          # header has said "version : code ?" since the log existed. That
          # cost real time - a log was read as evidence about a build it did
          # not come from, because nothing in it said otherwise.
          #
          # Not committed: this runs after the harvest step, and that step
          # only ever stages precompiled_astc_imports.
          python3 - "$NEW_CODE" "${{ github.sha }}" <<'PY'
          import re, sys

          code, sha = sys.argv[1], sys.argv[2][:8]
          stamp = "%s-%s" % (code, sha)
          text = open("project.godot", encoding="utf-8").read()

          line = 'config/version="%s"\n' % stamp
          if re.search(r'^config/version=', text, re.M):
              text = re.sub(r'^config/version=.*\n', line, text, count=1, flags=re.M)
          else:
              # Straight after config/name, which every project.godot has.
              text = re.sub(r'^(config/name=.*\n)', r'\1' + line, text, count=1, flags=re.M)

          open("project.godot", "w", encoding="utf-8").write(text)
          print("application/config/version set to %s" % stamp)
          PY

      - name: Build Android APK
        id: build
        run: |
          # Which engine template goes in the APK, which is a different
          # question from which key signs it. Every build this project has
          # ever shipped used --export-debug and was then re-signed with the
          # release keystore, so the APK on the tester's phone has been a
          # debug engine wearing a release signature.
          #
          # That is not free. A debug template compiles in DEBUG_ENABLED, the
          # remote debugger and the profiler, and - the part that matters
          # here - runs GDScript with its per-instruction debug bookkeeping
          # for line numbers and stack traces. This project's two unexplained
          # costs are both of that shape: Monochrome's script_max sits at
          # 19.5ms median and 80.9ms worst with no subsystem accounting for
          # more than ~3ms of it, and seven of the shop's spikes are 50-150ms
          # frames where gpu, script, cpu_render and phys together sum to 26.
          #
          # So this is worth an A/B rather than a switch flipped on faith.
          # Both are kept, release is the default, and the two are directly
          # comparable because the same keystore signs both.
          #
          # package/signed=false on the release preset on purpose: Godot
          # refuses to export release with signing on unless the preset
          # carries keystore/release credentials ("Could not find release
          # keystore, unable to export"), and putting the key in the preset
          # is worse than leaving apksigner to do it from the secret, which
          # is what already keeps every build installable over the last one.
          BUILD_TYPE="${{ inputs.build_type }}"
          BUILD_TYPE="${BUILD_TYPE:-release}"

          if [ "$BUILD_TYPE" = "debug" ]; then
            PRESET="Android Debug"; FLAG="--export-debug"
          else
            PRESET="Android Release"; FLAG="--export-release"
          fi

          # Que ABI se construyen. `all` no es una configuracion del preset,
          # son tres exportaciones, asi que se expande aqui y no en el script
          # que edita export_presets.cfg.
          ABI="${{ inputs.abi }}"
          ABI="${ABI:-arm64}"
          if [ "$ABI" = "all" ]; then
            VARIANTS="arm64 arm32 both"
          else
            VARIANTS="$ABI"
          fi
          echo "Exporting preset '$PRESET' with $FLAG for: $VARIANTS"

          for v in $VARIANTS; do
            # El preset se reescribe entre exportaciones, asi que esto tiene
            # que correr una vez por variante y no fuera del bucle.
            python3 tools/set_export_abi.py "$PRESET" "$v"

            OUT="builds/${BUILD_TYPE}_${v}.apk"
            $GODOT --headless $FLAG "$PRESET" "$OUT" 2>&1

            if [ ! -f "$OUT" ]; then
              echo "::error::la exportacion $v no produjo $OUT"
              echo "build_success=false" >> $GITHUB_OUTPUT
              exit 1
            fi
            echo "  $v -> $OUT ($(du -h "$OUT" | cut -f1))"
          done

          # Y en el resumen de la corrida, no solo en el log. El API de logs
          # devuelve la cola del job, y con los pasos de subida escupiendo una
          # linea por cada 8 MB el paso de build queda siempre fuera de alcance
          # - hubo que deducir que las tres variantes eran distintas restando
          # totales de artefactos entre dos corridas. El resumen se lee de una.
          {
            echo "### APKs exportados (\`$BUILD_TYPE\`, abi=\`$ABI\`)"
            echo ""
            echo "| variante | tamaño |"
            echo "| --- | ---: |"
            for f in builds/${BUILD_TYPE}_*.apk; do
              v="$(basename "$f" .apk)"; v="${v##*_}"
              echo "| $v | $(du -h "$f" | cut -f1) |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

          # export_presets.cfg queda modificado en el runner. No se commitea
          # nada, pero dejarlo como estaba evita que un paso posterior lea un
          # preset que no es el del repo.
          git checkout -- export_presets.cfg || true

          FIRST=$(ls builds/${BUILD_TYPE}_*.apk | head -1)
          echo "APK_SIZE=$(du -h "$FIRST" | cut -f1)" >> $GITHUB_OUTPUT
          echo "build_type=$BUILD_TYPE" >> $GITHUB_OUTPUT
          echo "abi=$ABI" >> $GITHUB_OUTPUT
          echo "build_success=true" >> $GITHUB_OUTPUT

      - name: Sign APK with Release Keystore
        if: steps.build.outputs.build_success == 'true'
        run: |
          # Una firma por APK. Con abi=all son tres, y los tres llevan la
          # MISMA clave a proposito: asi se pueden instalar uno sobre otro para
          # compararlos sin desinstalar y perder la partida guardada.
          for apk in builds/${{ steps.build.outputs.build_type }}_*.apk; do
            v="$(basename "$apk" .apk)"; v="${v##*_}"
            $ANDROID_HOME/build-tools/${{ env.ANDROID_BUILD_TOOLS }}/apksigner sign \
              --ks ~/.android/release.keystore \
              --ks-pass pass:${{ secrets.KEYSTORE_PASSWORD }} \
              --key-pass pass:${{ secrets.KEY_PASSWORD }} \
              --ks-key-alias ${{ secrets.KEY_ALIAS }} \
              --out "builds/rubicon-release-${v}.apk" \
              "$apk"
            echo "Signed: builds/rubicon-release-${v}.apk"
          done

          ls -lh builds/

      - name: Upload APK artifact
        if: steps.build.outputs.build_success == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: rubicon-fnfr-android-release
          path: builds/rubicon-release-*.apk
          retention-days: 3
          compression-level: 9

      - name: Upload debug symbols
        if: steps.build.outputs.build_success == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: rubicon-fnfr-android-debug-symbols
          path: |
            builds/*.apk.idsig
          retention-days: 3

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      apk_size: ${{ needs.build.outputs.apk_size }}

    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: rubicon-fnfr-android-release
          path: .

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          files: rubicon-release-*.apk
          generate_release_notes: true
          prerelease: ${{ !contains(github.ref, '-rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  check:
    name: Build Check
    runs-on: ubuntu-latest
    steps:
      # No LFS at all. This job runs four `test -f` over project.godot,
      # export_presets.cfg, an addon directory and build.sh - not one of them
      # is LFS-tracked - and it was pulling ~398MB of precompiled imports to
      # do it, on every run, against a 1GB monthly allowance.
      - name: Checkout
        uses: actions/checkout@v4
        env:
          GIT_LFS_SKIP_SMUDGE: 1
        with:
          lfs: false
          sparse-checkout: |
            /*
            !/lullaby_mod/original_pck/
          sparse-checkout-cone-mode: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify project structure
        run: |
          echo "Checking project files..."
          test -f project.godot && echo "✓ project.godot exists"
          test -f export_presets.cfg && echo "✓ export_presets.cfg exists"
          test -d addons/rubicon_mobile_controls && echo "✓ rubicon_mobile_controls addon exists"
          test -f build.sh && echo "✓ build.sh exists"
          echo ""
          echo "Project structure verified!"
