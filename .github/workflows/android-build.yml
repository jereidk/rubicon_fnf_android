name: Android Build

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: none
  security-events: none
  attestations: none
  statuses: none

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: '4.7.1-stable'
  GODOT_VERSION_FOLDER: '4.7.1.stable'
  JAVA_VERSION: '21'
  ANDROID_API: '34'
  ANDROID_BUILD_TOOLS: '34.0.0'
  ANDROID_NDK: '26.1.10909125'
  DEBIAN_FRONTEND: 'noninteractive'
  ACTIONS_RUNNER_DEBUG: 'true'

jobs:
  # Builds a patched Godot editor binary (Linux x86_64) - the ASTC 10x10/12x12
  # patch (godot-patches/astc_10x10_12x12.patch) touches core/io/image.cpp,
  # whose compress() path is TOOLS_ENABLED-only, i.e. only exists in editor
  # builds. This is the binary that runs "--headless --import" below - it's
  # what has to exist for Godot to be *able* to compress a texture to 12x12
  # in the first place. See the patch file's own commit message for why this
  # can't be done as a stock export_presets.cfg setting.
  build-godot-editor:
    name: Build patched Godot editor (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (patch only)
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            godot-patches
          sparse-checkout-cone-mode: false

      - name: Restore patched editor cache
        id: cache-patched-editor
        uses: actions/cache@v4
        with:
          path: godot-out/godot_editor.linuxbsd.x86_64
          key: godot-patched-editor-${{ env.GODOT_VERSION }}-${{ hashFiles('godot-patches/*.patch') }}

      - name: Clone Godot source
        if: steps.cache-patched-editor.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch ${{ env.GODOT_VERSION }} https://github.com/godotengine/godot.git godot-src

      - name: Apply ASTC patch
        if: steps.cache-patched-editor.outputs.cache-hit != 'true'
        run: |
          cd godot-src
          git apply --verbose ../godot-patches/astc_10x10_12x12.patch

      - name: Restore SCons object cache
        if: steps.cache-patched-editor.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: .scons-cache
          key: godot-sconscache-editor-${{ env.GODOT_VERSION }}-${{ github.run_id }}
          restore-keys: |
            godot-sconscache-editor-${{ env.GODOT_VERSION }}-
            godot-sconscache-editor-

      - name: Setup Python and SCons
        if: steps.cache-patched-editor.outputs.cache-hit != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Build editor
        if: steps.cache-patched-editor.outputs.cache-hit != 'true'
        run: |
          pip install scons==4.10.1
          cd godot-src
          scons platform=linuxbsd target=editor production=yes -j$(nproc) cache_path=${{ github.workspace }}/.scons-cache
          mkdir -p ${{ github.workspace }}/godot-out
          BIN=$(find bin -maxdepth 1 -iname "godot.linuxbsd.editor*" -type f | head -1)
          test -n "$BIN"
          cp "$BIN" ${{ github.workspace }}/godot-out/godot_editor.linuxbsd.x86_64
          chmod +x ${{ github.workspace }}/godot-out/godot_editor.linuxbsd.x86_64

      - name: Upload patched editor artifact
        uses: actions/upload-artifact@v4
        with:
          name: godot-patched-editor
          path: godot-out/godot_editor.linuxbsd.x86_64
          retention-days: 7

  # Builds a patched Godot Android export template (template_debug, arm64
  # only - export_presets.cfg has every other architecture disabled). This is
  # the runtime that actually ships inside the APK and runs on-device; it
  # needs the same patch as the editor above so it can *decode* an ASTC
  # 10x10/12x12 texture and upload it via the GLES3/Vulkan driver code the
  # patch also touches. NOTE: this job has not been exercised on a real CI
  # run yet - if it fails, check the exact Gradle/NDK version pinned by this
  # Godot tag against ANDROID_NDK/JAVA_VERSION below first.
  build-godot-template:
    name: Build patched Godot Android template (arm64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (patch only)
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            godot-patches
          sparse-checkout-cone-mode: false

      - name: Restore patched template cache
        id: cache-patched-template
        uses: actions/cache@v4
        with:
          path: godot-out/android_debug.apk
          key: godot-patched-template-arm64-${{ env.GODOT_VERSION }}-${{ hashFiles('godot-patches/*.patch') }}

      - name: Setup Java JDK
        if: steps.cache-patched-template.outputs.cache-hit != 'true'
        uses: actions/setup-java@v4
        with:
          # Matches the JDK version Godot's own official Android build CI
          # uses for the gradlew step below - independent of the JAVA_VERSION
          # used elsewhere in this workflow for apksigner.
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Android SDK
        if: steps.cache-patched-template.outputs.cache-hit != 'true'
        id: cache-android-sdk-tpl
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/sdk
          key: android-sdk-${{ runner.os }}-${{ env.ANDROID_API }}-${{ env.ANDROID_BUILD_TOOLS }}-${{ env.ANDROID_NDK }}
          restore-keys: |
            android-sdk-${{ runner.os }}-

      - name: Setup Android SDK
        if: steps.cache-patched-template.outputs.cache-hit != 'true' && steps.cache-android-sdk-tpl.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.android/sdk/cmdline-tools
          cd ~/.android/sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip
          mv cmdline-tools latest
          rm cmdline-tools.zip

      - name: Accept Android licenses and install SDK components
        if: steps.cache-patched-template.outputs.cache-hit != 'true'
        run: |
          yes | ~/.android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          ~/.android/sdk/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" \
            "platforms;android-${{ env.ANDROID_API }}" \
            "build-tools;${{ env.ANDROID_BUILD_TOOLS }}" \
            "ndk;${{ env.ANDROID_NDK }}"

      - name: Clone Godot source
        if: steps.cache-patched-template.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch ${{ env.GODOT_VERSION }} https://github.com/godotengine/godot.git godot-src

      - name: Apply ASTC patch
        if: steps.cache-patched-template.outputs.cache-hit != 'true'
        run: |
          cd godot-src
          git apply --verbose ../godot-patches/astc_10x10_12x12.patch

      - name: Restore SCons object cache
        if: steps.cache-patched-template.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: .scons-cache
          key: godot-sconscache-template-arm64-${{ env.GODOT_VERSION }}-${{ github.run_id }}
          restore-keys: |
            godot-sconscache-template-arm64-${{ env.GODOT_VERSION }}-
            godot-sconscache-template-arm64-

      - name: Setup Python and SCons
        if: steps.cache-patched-template.outputs.cache-hit != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Build Android template and package APK
        if: steps.cache-patched-template.outputs.cache-hit != 'true'
        run: |
          # ~/.android/sdk (below) resolves via the shell at runtime, unlike
          # a hardcoded env: block above which is NOT shell-expanded - an
          # earlier version of this step hardcoded /root/.android/sdk, which
          # doesn't exist on the default ubuntu-latest runner (user "runner",
          # home /home/runner, not /root). That silently broke NDK detection:
          # SCons's android/detect.py can_build() check failed to find the
          # NDK and just omitted "android" from the list of buildable
          # platforms entirely, rather than erroring on a bad path directly.
          export ANDROID_HOME=~/.android/sdk
          export ANDROID_SDK_ROOT=~/.android/sdk
          export ANDROID_NDK_ROOT=~/.android/sdk/ndk/${{ env.ANDROID_NDK }}
          pip install scons==4.10.1
          cd godot-src
          scons platform=android target=template_debug arch=arm64 production=yes -j$(nproc) cache_path=${{ github.workspace }}/.scons-cache
          cd platform/android/java
          ./gradlew generateGodotTemplates
          cd ../../..
          ls -l bin/
          mkdir -p ${{ github.workspace }}/godot-out
          test -f bin/android_debug.apk
          cp bin/android_debug.apk ${{ github.workspace }}/godot-out/android_debug.apk

      - name: Upload patched template artifact
        uses: actions/upload-artifact@v4
        with:
          name: godot-patched-template
          path: godot-out/android_debug.apk
          retention-days: 7

  build:
    name: Build Android APK
    needs: [build-godot-editor, build-godot-template]
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
          sparse-checkout: |
            /*
            !/lullaby_mod/original_pck/
          sparse-checkout-cone-mode: false

      - name: Download patched Android template
        uses: actions/download-artifact@v4
        with:
          name: godot-patched-template
          path: /tmp/godot-template

      - name: Install patched Android template
        run: |
          mkdir -p ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION_FOLDER }}
          cp /tmp/godot-template/android_debug.apk ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION_FOLDER }}/android_debug.apk

      - name: Download patched Godot editor
        uses: actions/download-artifact@v4
        with:
          name: godot-patched-editor
          path: /tmp/godot-editor

      - name: Install patched Godot editor
        run: |
          mkdir -p /opt/godot
          cp /tmp/godot-editor/godot_editor.linuxbsd.x86_64 /opt/godot/godot
          chmod +x /opt/godot/godot

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Cache Android SDK
        id: cache-android-sdk
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/sdk
          key: android-sdk-${{ runner.os }}-${{ env.ANDROID_API }}-${{ env.ANDROID_BUILD_TOOLS }}-${{ env.ANDROID_NDK }}
          restore-keys: |
            android-sdk-${{ runner.os }}-

      - name: Setup Android SDK
        if: steps.cache-android-sdk.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.android/sdk/cmdline-tools
          cd ~/.android/sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip
          mv cmdline-tools latest
          rm cmdline-tools.zip

      - name: Accept Android licenses
        run: |
          yes | ~/.android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Install Android SDK components
        run: |
          ~/.android/sdk/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" \
            "platforms;android-${{ env.ANDROID_API }}" \
            "build-tools;${{ env.ANDROID_BUILD_TOOLS }}" \
            "ndk;${{ env.ANDROID_NDK }}"

      - name: Create ephemeral debug keystore
        run: |
          # This keystore only signs the intermediate build (below); it's
          # thrown away and doesn't matter which certificate it uses - the
          # APK actually shipped gets re-signed with the persistent release
          # keystore in "Sign APK with Release Keystore" further down, which
          # is what makes every build installable as an update over the
          # last one (Android requires the same certificate across updates).
          mkdir -p ~/.android
          keytool -genkeypair -v \
            -keystore ~/.android/debug.keystore \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            2>/dev/null

      - name: Restore release keystore
        run: |
          mkdir -p ~/.android
          echo "${{ secrets.KEYSTORE_FILE }}" | base64 -d > ~/.android/release.keystore

      - name: Configure environment
        run: |
          echo "ANDROID_HOME=$HOME/.android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$HOME/.android/sdk" >> $GITHUB_ENV
          # Find Java installed by setup-java
          JAVA_DIR=$(find /opt/hostedtoolcache/Java_Temurin-JDK -maxdepth 1 -type d -name "*${{ env.JAVA_VERSION }}*" 2>/dev/null | head -1)
          if [ -n "$JAVA_DIR" ]; then
            JAVA_HOME_DIR="$JAVA_DIR/x64"
          else
            # Fallback: use java from PATH and get its parent directory
            JAVA_BIN=$(which java 2>/dev/null)
            JAVA_HOME_DIR=$(dirname $(dirname $JAVA_BIN) 2>/dev/null)
          fi
          echo "JAVA_HOME=${JAVA_HOME_DIR}" >> $GITHUB_ENV
          echo "GODOT=/opt/godot/godot" >> $GITHUB_ENV

      - name: Print environment
        run: |
          echo "Java version:"
          java -version 2>&1 | head -1
          echo ""
          echo "JAVA_HOME=${JAVA_HOME}"
          echo ""
          echo "Android SDK components:"
          ~/.android/sdk/cmdline-tools/latest/bin/sdkmanager --list_installed 2>/dev/null | grep -E "platforms|build-tools|ndk" || true
          echo ""
          echo "Godot version:"
          $GODOT --version || echo "Godot not found"

      - name: Cache Godot import cache
        uses: actions/cache@v4
        with:
          path: .godot/imported
          key: godot-import-${{ runner.os }}-${{ env.GODOT_VERSION }}-${{ hashFiles('**/*.png', '**/*.jpg', '**/*.ogg', '**/*.wav', '**/*.mp3', '**/*.gltf', '**/*.glb', '**/*.ttf', '**/*.otf', '**/*.tres', '**/*.tscn', 'project.godot') }}
          restore-keys: |
            godot-import-${{ runner.os }}-${{ env.GODOT_VERSION }}-

      - name: Import Godot project
        run: |
          $GODOT --headless --import 2>&1

      - name: Create builds directory
        run: |
          mkdir -p builds

      - name: Bump Android version code
        run: |
          # version/code must strictly increase for Android to accept an APK
          # as a valid update over whatever is already installed (a build
          # signed identically but with an equal/lower versionCode fails with
          # INSTALL_FAILED_VERSION_DOWNGRADE unless the installer passes -d).
          # The workflow run number always increases run over run, so it's a
          # simple monotonic source - offset it well above the manually-set
          # value in export_presets.cfg so it never collides with it.
          NEW_CODE=$((10000 + ${{ github.run_number }}))
          sed -i "s/^version\/code=.*/version\/code=${NEW_CODE}/" export_presets.cfg
          echo "version/code set to ${NEW_CODE}"

      - name: Build Android Debug APK
        id: build
        run: |
          $GODOT --headless --export-debug "Android Debug" builds/android_debug.apk 2>&1
          
          if [ -f builds/android_debug.apk ]; then
            echo "APK_SIZE=$(du -h builds/android_debug.apk | cut -f1)" >> $GITHUB_OUTPUT
            echo "apk_path=builds/android_debug.apk" >> $GITHUB_OUTPUT
            echo "build_success=true" >> $GITHUB_OUTPUT
          else
            echo "build_success=false" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: Sign APK with Release Keystore
        if: steps.build.outputs.build_success == 'true'
        run: |
          $ANDROID_HOME/build-tools/${{ env.ANDROID_BUILD_TOOLS }}/apksigner sign \
            --ks ~/.android/release.keystore \
            --ks-pass pass:${{ secrets.KEYSTORE_PASSWORD }} \
            --key-pass pass:${{ secrets.KEY_PASSWORD }} \
            --ks-key-alias ${{ secrets.KEY_ALIAS }} \
            --out builds/rubicon-release.apk \
            builds/android_debug.apk

          echo "Signed APK: builds/rubicon-release.apk"
          ls -lh builds/

      - name: Upload APK artifact
        if: steps.build.outputs.build_success == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: rubicon-fnfr-android-release
          path: builds/rubicon-release.apk
          retention-days: 3
          compression-level: 9

      - name: Upload debug symbols
        if: steps.build.outputs.build_success == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: rubicon-fnfr-android-debug-symbols
          path: |
            builds/*.apk.idsig
          retention-days: 3

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      apk_size: ${{ needs.build.outputs.apk_size }}

    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: rubicon-fnfr-android-release
          path: .

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          files: rubicon-release.apk
          generate_release_notes: true
          prerelease: ${{ !contains(github.ref, '-rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  check:
    name: Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          sparse-checkout: |
            /*
            !/lullaby_mod/original_pck/
          sparse-checkout-cone-mode: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify project structure
        run: |
          echo "Checking project files..."
          test -f project.godot && echo "✓ project.godot exists"
          test -f export_presets.cfg && echo "✓ export_presets.cfg exists"
          test -d addons/rubicon_mobile_controls && echo "✓ rubicon_mobile_controls addon exists"
          test -f build.sh && echo "✓ build.sh exists"
          echo ""
          echo "Project structure verified!"
