name: Android Build

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: >-
          release uses Godot's release engine template; debug uses the debug
          one. Both are signed with the same release keystore afterwards, so
          both install as updates over each other.
        required: false
        default: 'release'
        type: choice
        options:
          - release
          - debug
      precompile_match:
        description: >-
          Leave empty for a normal build. Set to one or more space-separated
          globs to also harvest the imports they match into
          precompiled_astc_imports/ and commit them to this branch, e.g.
          *_packed_*.png  or  loading.png nte_default.png
        required: false
        default: ''
      render_cutscene:
        description: >-
          Leave empty for a normal build. Set to the arguments for
          tools/harness/render_cutscene.gd to also render a cutscene to .ogv
          and upload it as an artifact, e.g.
          res://lullaby_mod/songs/safety_lullaby/sng_safety_lullaby.tscn anim=play hasta=31.5
        required: false
        default: ''
      cutscene_scale:
        description: >-
          Delivery width for the rendered .ogv. The source is always the
          project's native 1366x768; this only picks what gets shipped, and it
          is a DECODE-COST decision made on the weakest target, not a quality
          one. Theora decodes on the main thread, so every millisecond comes
          straight out of the frame budget. Measured on the engine's own
          decoder: ms = 1.32 + 3.49 x Mpx, and 960x432 extrapolates to ~3ms on
          the g53 but ~8.5ms on an A12 - roughly 3x. Carry that factor and
          1280x720 lands near 14ms of a 16.7ms budget at 60fps on that device,
          which is not "a bit more expensive", it is the whole frame.
          Raising this is a real option, but it needs a device measurement
          first, not the desktop figure - the desktop number for 1280 is
          ~4.5ms and looks perfectly safe, which is exactly the trap.
        required: false
        default: '960'
      cutscene_fps:
        description: >-
          Recording frame rate. 60 by default, and measured rather than
          assumed: the same content at 960x540 costs 6.82 CPU-seconds at 30fps
          and 8.23 at 60 over the same 20s, so twice the frames is only 21%
          more CPU - each frame carries less change and decodes cheaper (2.84
          ms/decode at 30, 1.71 at 60). It also paces better in a 60fps game: a
          small cost every frame instead of a bigger one every other frame.
          Costs 52% more bytes.
        required: false
        default: '60'
      abi:
        description: >-
          Which Android ABIs to build. arm64 is the default and is what every
          build so far has shipped.

          arm32 builds armeabi-v7a only, for a 32-bit device. both puts the two
          in one APK, which installs anywhere at the cost of carrying two sets
          of native libraries - that is the one to hand someone whose phone you
          do not know. all produces the three APKs above as three separate
          files, for comparing them.

          x86 and x86_64 stay off in every case. They are emulator ABIs, nothing
          here has been tested on one, and shipping them would only make the APK
          bigger.
        required: false
        default: 'arm64'
        type: choice
        options:
          - arm64
          - arm32
          - both
          - all
      export_import_cache:
        description: >-
          Set to true to also upload .godot/imported as an artifact. It is
          about 1.1 GB, so this is off by default and is not something a build
          should carry.

          What it is for: a fresh checkout has no import cache, and building
          one costs roughly 90 minutes of wall time - the first minutes are the
          slowest because the largest textures are imported first. A remote
          session runs in a container that is reclaimed when it ends, so that
          cost is paid again from zero every session, and a render harness
          cannot run at all until it is paid: with the cache incomplete the
          engine still renders, it just renders the 3D house and Hex with no
          textures, which looks like a lighting problem rather than a missing
          file.

          CI already pays this cost on every build. This just keeps the result.
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      cutscene_trim:
        description: >-
          Seconds to drop from the START of the render before encoding. This is
          how a video of the MIDDLE of a song gets made: desde= cannot do it,
          because seek() never dispatches the clips that carry the visible
          state - run #191 proved that by delivering the HUD over absolute
          black. So the render runs from 0 and the head is thrown away here.
          Rendering seconds you are going to discard is affordable because the
          per-frame cost is flat: run #189's 2078 heartbeats measured 5154
          ms/frame on a black screen against 5165 in the intro, 0.2% apart,
          since the 3D house draws from second zero either way. Leave empty or
          0 to keep the whole render.
        required: false
        default: ''
      cutscene_msaa:
        description: >-
          MSAA for the capture, appended as msaa=... unless render_cutscene
          already says so. Defaults to off, and that is a speed decision with
          the quality cost already accounted for: the capture renders at the
          project's native 1366 and ships scaled to 960, and that rescale
          averages ~1.4 source pixels per delivered pixel, which is itself
          antialiasing. Meanwhile CI rasterises in software, where MSAA 2
          multiplies real fragment work - and fragment work is what makes a
          Chimera render take three hours. Set it to an empty value to use
          whatever the preset asks for.
        required: false
        default: 'off'
      cutscene_quality:
        description: >-
          libtheora -q:v, 0-10. Measured on the engine's own decoder at
          1600x720: q5/q7/q9 cost 22.62/23.46/22.60 CPU-seconds over the same
          2400 decodes, which is noise - compression quality costs bytes and
          not a single millisecond of playback. So this runs high on purpose.
          Resolution is the knob that costs frame time; this one does not.
        required: false
        default: '8'

permissions:
  contents: read
  packages: none
  security-events: none
  attestations: none
  statuses: none

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: '4.7.1-stable'
  GODOT_VERSION_FOLDER: '4.7.1.stable'
  JAVA_VERSION: '21'
  ANDROID_API: '34'
  ANDROID_BUILD_TOOLS: '34.0.0'
  ANDROID_NDK: '26.1.10909125'
  DEBIAN_FRONTEND: 'noninteractive'
  ACTIONS_RUNNER_DEBUG: 'true'

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    # Only so the harvest step below can push what it collected. Every other
    # step in this job reads.
    permissions:
      contents: write

    steps:
      # Pointers only, deliberately. Every LFS object inside the sparse
      # checkout is a precompiled import - about 398MB of them - and smudging
      # on checkout spends that much LFS bandwidth on every single run. Three
      # runs is past the 1GB a month the free allowance gives, which is
      # exactly what took build #109 down before it reached step 3:
      #
      #   batch response: This repository exceeded its LFS budget.
      #
      # The objects are fetched below instead, from a cache when there is one.
      - name: Checkout repository
        uses: actions/checkout@v4
        env:
          GIT_LFS_SKIP_SMUDGE: 1
        with:
          lfs: false
          sparse-checkout: |
            /*
            !/lullaby_mod/original_pck/
          sparse-checkout-cone-mode: false

      - name: Cache Git LFS objects
        id: cache-lfs
        uses: actions/cache@v4
        with:
          path: .git/lfs/objects
          # A skipped smudge leaves each file as its pointer, and a pointer is
          # literally the object's oid, so hashing them keys the cache on the
          # LFS content itself and on nothing else. Editing a .gd or a .tscn
          # does not move this key; adding a precompiled import does.
          key: lfs-${{ runner.os }}-${{ hashFiles('precompiled_astc_imports/*.res', '**/*.lmbake', '**/*.ctex') }}

      - name: Materialise Git LFS files
        run: |
          # Nothing in LFS is required any more. The only game assets that were
          # behind it - two lightmap bakes, 510KB together - are plain git
          # objects now; everything left is precompiled import output, which is
          # a build accelerator. So an LFS outage has to degrade this job, not
          # end it, and `git lfs pull` failing is not fatal.
          #
          # checkout, not pull, when the objects are already local: it smudges
          # out of .git/lfs/objects and never contacts the server, so a warm
          # cache costs zero bandwidth. Only a miss pays for a fetch.
          if [ "${{ steps.cache-lfs.outputs.cache-hit }}" = "true" ]; then
            echo "LFS cache hit - materialising from local objects"
            git lfs checkout || echo "::warning::git lfs checkout fallo"
          else
            echo "LFS cache miss - fetching from the server"
            git lfs pull || echo "::warning::git lfs pull fallo (presupuesto agotado?)"
          fi

          # Whatever is still a pointer is unusable, and has to be named rather
          # than fed to Godot: the restore step below would otherwise copy 130
          # bytes of text into .godot/imported/ as though it were a compressed
          # texture. Counted here, skipped there.
          pointers=0
          for f in $(git lfs ls-files -n); do
            [ -f "$f" ] || continue
            if head -c 64 "$f" | grep -q "git-lfs.github.com/spec"; then
              pointers=$((pointers + 1))
            fi
          done

          total=$(git lfs ls-files -n | wc -l)
          echo "LFS: $((total - pointers))/$total materializados, $pointers sin resolver"
          if [ "$pointers" -gt 0 ]; then
            echo "::warning::$pointers objetos LFS sin resolver - se importara desde las fuentes"
            echo "### LFS degradado" >> "$GITHUB_STEP_SUMMARY"
            echo "$pointers de $total objetos no se pudieron descargar." >> "$GITHUB_STEP_SUMMARY"
            echo "El build continua reimportando desde las fuentes: mas lento, mismo resultado." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION_FOLDER }}
          key: godot-${{ runner.os }}-${{ env.GODOT_VERSION }}

      - name: Download Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION_FOLDER }}
          wget -q https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}/Godot_v${{ env.GODOT_VERSION }}_export_templates.tpz -O /tmp/templates.tpz
          unzip -q /tmp/templates.tpz -d ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION_FOLDER }}
          mv ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION_FOLDER }}/templates/* ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION_FOLDER }}/
          rm -rf ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION_FOLDER }}/templates
          rm /tmp/templates.tpz

      - name: Cache Godot binary
        id: cache-godot-bin
        uses: actions/cache@v4
        with:
          path: |
            /opt/godot
          key: godot-bin-${{ runner.os }}-${{ env.GODOT_VERSION }}

      - name: Download Godot binary
        if: steps.cache-godot-bin.outputs.cache-hit != 'true'
        run: |
          mkdir -p /opt/godot
          wget -q https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}/Godot_v${{ env.GODOT_VERSION }}_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /opt/godot
          chmod +x /opt/godot/Godot_v${{ env.GODOT_VERSION }}_linux.x86_64
          rm /tmp/godot.zip
          ln -sf /opt/godot/Godot_v${{ env.GODOT_VERSION }}_linux.x86_64 /opt/godot/godot

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Cache Android SDK
        id: cache-android-sdk
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/sdk
          key: android-sdk-${{ runner.os }}-${{ env.ANDROID_API }}-${{ env.ANDROID_BUILD_TOOLS }}-${{ env.ANDROID_NDK }}
          restore-keys: |
            android-sdk-${{ runner.os }}-

      - name: Setup Android SDK
        if: steps.cache-android-sdk.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.android/sdk/cmdline-tools
          cd ~/.android/sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip
          mv cmdline-tools latest
          rm cmdline-tools.zip

      - name: Accept Android licenses
        run: |
          yes | ~/.android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Install Android SDK components
        run: |
          ~/.android/sdk/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" \
            "platforms;android-${{ env.ANDROID_API }}" \
            "build-tools;${{ env.ANDROID_BUILD_TOOLS }}" \
            "ndk;${{ env.ANDROID_NDK }}"

      - name: Create ephemeral debug keystore
        run: |
          # This keystore only signs the intermediate build (below); it's
          # thrown away and doesn't matter which certificate it uses - the
          # APK actually shipped gets re-signed with the persistent release
          # keystore in "Sign APK with Release Keystore" further down, which
          # is what makes every build installable as an update over the
          # last one (Android requires the same certificate across updates).
          mkdir -p ~/.android
          keytool -genkeypair -v \
            -keystore ~/.android/debug.keystore \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            2>/dev/null

      - name: Restore release keystore
        run: |
          mkdir -p ~/.android
          echo "${{ secrets.KEYSTORE_FILE }}" | base64 -d > ~/.android/release.keystore

      - name: Configure environment
        run: |
          echo "ANDROID_HOME=$HOME/.android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$HOME/.android/sdk" >> $GITHUB_ENV
          # Find Java installed by setup-java
          JAVA_DIR=$(find /opt/hostedtoolcache/Java_Temurin-JDK -maxdepth 1 -type d -name "*${{ env.JAVA_VERSION }}*" 2>/dev/null | head -1)
          if [ -n "$JAVA_DIR" ]; then
            JAVA_HOME_DIR="$JAVA_DIR/x64"
          else
            # Fallback: use java from PATH and get its parent directory
            JAVA_BIN=$(which java 2>/dev/null)
            JAVA_HOME_DIR=$(dirname $(dirname $JAVA_BIN) 2>/dev/null)
          fi
          echo "JAVA_HOME=${JAVA_HOME_DIR}" >> $GITHUB_ENV
          echo "GODOT=/opt/godot/godot" >> $GITHUB_ENV

      - name: Print environment
        run: |
          echo "Java version:"
          java -version 2>&1 | head -1
          echo ""
          echo "JAVA_HOME=${JAVA_HOME}"
          echo ""
          echo "Android SDK components:"
          ~/.android/sdk/cmdline-tools/latest/bin/sdkmanager --list_installed 2>/dev/null | grep -E "platforms|build-tools|ndk" || true
          echo ""
          echo "Godot version:"
          $GODOT --version || echo "Godot not found"

      - name: Cache Godot import cache
        uses: actions/cache@v4
        with:
          path: |
            .godot/imported
            .godot/uid_cache.bin
          # restore-keys previously got removed here on the theory that a
          # prefix-match fallback (serving the *closest* previous cache on
          # an exact-key miss) was why the shop scene crashed twice with
          # "Failed to load resource uid://..." - the idea being Godot's
          # incremental reimport on top of that stale base doesn't reliably
          # re-persist freshly-registered UIDs to uid_cache.bin before the
          # next (separate) $GODOT process reads it back.
          #
          # That theory doesn't hold up: a build with restore-keys fully
          # removed (an exact-key miss, genuinely empty .godot/imported,
          # the "safe" cold-import case this was supposed to guarantee) hit
          # the exact same crash again - Import step resolved every
          # ext_resource fine, Export step failed the same uid_cache
          # lookups regardless. Whatever's actually causing the export-time
          # UID gap, it isn't restore-keys - that fix never got validated
          # against a real build before being trusted. Restoring
          # restore-keys here so commits that don't touch a hashed file get
          # a useful partial cache instead of a full cold rebuild every
          # time.
          # `**/*.import` esta en la lista, y su ausencia costo 28 avisos por
          # arranque en el telefono.
          #
          # Un .import lleva el uid con el que se importo su fuente. Si ese uid
          # cambia y el .png no, la clave no se movia y CI restauraba el
          # .godot/imported de antes - incluido el .scn de mdl_shop_base.gltf,
          # que referencia sus texturas POR UID. El resultado en el dispositivo:
          #
          #     'mdl_shop_base.gltf': In external resource #0, invalid UID:
          #     'uid://b4or6wqc5ygp0' - using text path instead: ...rug.png
          #
          # x28, una por textura. Godot cae a la ruta de texto y el modelo se ve
          # bien, asi que esto nunca rompio nada visible - pero el arbol
          # importado que se estaba enviando era mas viejo que el proyecto. Un
          # import local limpio da el uid correcto (b28qifxbpkgla), que es como
          # se supo que la culpa era de la cache y no del .gltf.
          key: godot-import-v5-${{ runner.os }}-${{ env.GODOT_VERSION }}-${{ hashFiles('**/*.png', '**/*.jpg', '**/*.ogg', '**/*.wav', '**/*.mp3', '**/*.gltf', '**/*.glb', '**/*.ttf', '**/*.otf', '**/*.tres', '**/*.tscn', '**/*.gd', '**/*.gd.uid', '**/*.import', 'project.godot') }}
          restore-keys: |
            godot-import-v5-${{ runner.os }}-${{ env.GODOT_VERSION }}-

      - name: Restore precompiled ASTC imports
        run: |
          # These are pre-run outputs of the two custom ASTC import plugins
          # (astc_sprite_import, astc_normal_map), committed to the repo
          # instead of relying solely on the GitHub Actions cache above -
          # EXHAUSTIVE-quality ASTC compression across ~124 large textures
          # takes over an hour, and the Actions cache key changes (forcing a
          # cache miss) any time any tracked png/tscn/etc anywhere in the
          # project changes. Godot decides whether to skip reimporting a
          # file by comparing content MD5s (source PNG vs the .md5 sidecar's
          # source_md5, and the .res output vs its dest_md5) rather than
          # file timestamps, so this works correctly even on a fresh
          # checkout where every file's mtime is "now". See
          # precompiled_astc_imports/README.md for how to regenerate these.
          #
          # Each .res is only copied when it is real content. An unresolved LFS
          # pointer here is 130 bytes of text, and handing that to Godot as a
          # compressed texture is worse than not having it: skipping lets the
          # importer notice the output is missing and rebuild it from the PNG,
          # which is slow but correct. The .md5 sidecar only travels with a
          # .res that was actually copied - on its own it would tell Godot the
          # import is already done and there is nothing to rebuild.
          mkdir -p .godot/imported
          copied=0
          skipped=0
          for res in precompiled_astc_imports/*.res; do
            [ -f "$res" ] || continue
            if head -c 64 "$res" | grep -q "git-lfs.github.com/spec"; then
              skipped=$((skipped + 1))
              continue
            fi
            cp "$res" .godot/imported/
            md5="${res%.res}.md5"
            [ -f "$md5" ] && cp "$md5" .godot/imported/
            copied=$((copied + 1))
          done
          echo "Restored $copied precompiled ASTC imports ($skipped sin resolver)"
          if [ "$skipped" -gt 0 ]; then
            echo "::warning::$skipped imports precompilados no disponibles - Godot los rehara"
          fi

      - name: Restore precompiled lightmap imports
        run: |
          # Same idea as the ASTC step above, for the project's 3 baked
          # LightmapGI .exr files - Godot's own stock 2d_array_texture
          # importer, not the custom ASTC plugins, but disproportionately
          # slow on its own (one of them, chimera_base.exr, is ~11% of the
          # whole Import step by itself: an uncompressed HDR source
          # compressed twice, once for BPTC and once for ASTC). See
          # precompiled_lightmap_imports/README.md for how to regenerate.
          mkdir -p .godot/imported
          cp precompiled_lightmap_imports/*.ctexarray precompiled_lightmap_imports/*.md5 .godot/imported/
          echo "Restored $(ls precompiled_lightmap_imports/*.md5 | wc -l) precompiled lightmap imports"

      - name: Restore precompiled texture imports
        run: |
          # Same idea as the two steps above, for individually slow plain PNGs
          # on Godot's stock texture importer (not either custom ASTC plugin).
          #
          # This directory can legitimately be empty: moving a texture onto the
          # ASTC importer makes its .ctex here stale - the .import now expects a
          # .res - so the pair has to be deleted, and everything it used to hold
          # has been. The glob must not be allowed to fail the build when that
          # happens, which is what an unguarded `cp *.ctex` does.
          mkdir -p .godot/imported
          shopt -s nullglob
          files=(precompiled_texture_imports/*.ctex precompiled_texture_imports/*.md5)
          if [ ${#files[@]} -gt 0 ]; then
            cp "${files[@]}" .godot/imported/
          fi
          echo "Restored $(ls precompiled_texture_imports/*.md5 2>/dev/null | wc -l) precompiled texture imports"

      - name: Build ASTC normal map compressor
        run: |
          cd tools/astc_compress
          g++ -O2 -std=c++17 -pthread -I thirdparty/astcenc astc_compress.cpp thirdparty/astcenc/astcenc_*.cpp -o astc_compress
          chmod +x astc_compress
          cd ../..
          ls -la tools/astc_compress/astc_compress

      - name: Import Godot project
        run: |
          # Run twice: a single --import pass can leave resources generated
          # mid-scan (e.g. GLTF-embedded material/texture sub-resources)
          # registered on disk but not yet committed to Godot's UID cache,
          # so a dependent scene referencing them by UID fails to resolve
          # until a second pass, where everything is already up to date and
          # this repeats the scan just to finish registering those UIDs.
          # Godot's own CI docs recommend this for exactly this class of
          # "works in editor, breaks in --headless export" issue.
          $GODOT --headless --import 2>&1
          $GODOT --headless --import 2>&1

          # Los modelos importados mas pesados, porque son los que deciden lo
          # que tarda una escena en abrirse y hasta ahora nadie los miraba.
          #
          # El log del dispositivo del 2026-08-25 puso nombres a los huecos de
          # la carga de la tienda: 46.0s de carga con solo 14.5s repartidos
          # entre dependencias, y las pausas caen exactamente sobre estos
          # ficheros - doce segundos sin que llegue nada y despues
          # `+mdl_shop_base.gltf`, seis mas y despues `+cardboardsign.tscn`.
          # A ~2.5 MB/s de lectura y parseo en el telefono, treinta megas son
          # doce segundos. No es una cola larga de ficheros pequenos; son
          # cuatro modelos.
          echo "=== modelos importados mas pesados ==="
          find .godot/imported -name "*.scn" -size +1M -printf "%s\t%f\n" 2>/dev/null \
            | sort -rn | head -12 \
            | awk -F'\t' '{printf "%8.1f MB  %s\n", $1/1048576, $2}'

      - name: Upload the import cache
        if: ${{ inputs.export_import_cache == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: godot-import-cache
          path: .godot/imported
          # Estos ficheros ya son texturas comprimidas: comprimirlos otra vez
          # gasta minutos de runner para no quitar casi nada.
          compression-level: 0
          retention-days: 5

      - name: Harvest precompiled imports and commit them
        if: ${{ inputs.precompile_match != '' }}
        run: |
          # Why this runs here rather than on someone's machine: the .res
          # files are LFS objects, and the only place that reliably has both
          # a full checkout and permission to upload them is this runner.
          #
          # And why it is worth having at all - measured on run 31320235299,
          # which was a normal build of 37m42s:
          #
          #   Import Godot project   34m33s   (92% of the wall clock)
          #   of which _packed_      34m33s   (100% of the reimports)
          #
          # Godot reimported 51 files that run. 48 were the atlas sheets
          # b26ade9 repacked, at 55-107s each, because nothing had ever
          # committed their compiled output. Everything else in the project
          # came out of the Actions cache untouched. Filling those 48 in
          # takes the build to roughly four minutes.
          #
          # The harvest reads .godot/imported directly rather than an
          # exported APK, so it does not depend on the export succeeding and
          # cannot pick up a stale artifact - the import that produced these
          # files ran seconds ago, in this job, from this commit.
          # Space-separated, so one build can harvest textures that share no
          # glob. loading.png and nte_default.png are the case that forced
          # this: they live in different trees and the only fnmatch pattern
          # covering both also covers half the project, so a single --match
          # meant two full builds to collect two files. The script already
          # accepts --match more than once; only this line did not.
          #
          # Unquoted on purpose - word splitting is the feature here. The
          # values are globs the operator typed into workflow_dispatch, and
          # the loop passes each as one argument, so a pattern still cannot
          # turn into anything but a --match value.
          MATCH_ARGS=""
          for pat in ${{ inputs.precompile_match }}; do
            MATCH_ARGS="$MATCH_ARGS --match $pat"
          done
          # shellcheck disable=SC2086
          python3 tools/harvest_precompiled_imports.py .godot/imported $MATCH_ARGS

          if [ -z "$(git status --porcelain -- precompiled_astc_imports)" ]; then
            echo "Nothing new to commit - everything matching is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Scoped to the one directory: the checkout is sparse, and a bare
          # `git add -A` in a sparse working tree is how you accidentally
          # commit the deletion of everything the sparse filter excluded.
          git add precompiled_astc_imports
          git commit -m "Precompile the imports matching ${{ inputs.precompile_match }}

          Harvested from .godot/imported by the build that produced them, so
          each .res is the output of the source PNG at this commit. The .md5
          sidecars are what Godot's reimport-skip check reads back.

          See tools/verify_precompiled_astc.gd to check the pairs."
          git push origin HEAD:${{ github.ref_name }}

      # audit_alley_merged_background.py re-runs the background bake, which
      # resamples the layers and applies the measured PointLight2D bake -
      # Pillow + numpy; no other guard does.
      - name: Install Pillow and numpy for the guards
        run: pip install --quiet Pillow numpy

      - name: Run the guard suite
        run: |
          # Every guard in this repo runs here, in one step.
          #
          # They were 37 separate steps, which made the workflow tedious to
          # read and added a step's worth of runner overhead 37 times over.
          # Consolidating them buys two things beyond the shorter list:
          #
          #   * ALL guards run even after one fails, so a red build names
          #     every problem at once instead of one per push-and-wait cycle.
          #   * Each guard's output is wrapped in a ::group::, so the log is
          #     collapsed by default and still one click from the detail.
          #
          # Three shapes of guard, all handled below: a Godot script that
          # prints "todo OK" on success, a Godot script that only sets an
          # exit code, and a Python audit that just exits non-zero. The
          # reason each one exists stays in the comment above its own line
          # here, which is where it has always lived.
          #
          # Log files are named after the script rather than by hand - the
          # old steps had test_preload_sweep and test_retained_sweep both
          # writing /tmp/sweep.txt, which only worked because they were
          # separate steps.
          set +e
          set -o pipefail

          failed=()
          ran=0

          # Runs a Godot guard and returns its exit status, with the output
          # both shown and kept for the caller to inspect.
          run_godot() {     # <script> [--no-path] -> sets $LAST_LOG
            local script="$1"; shift
            LAST_LOG="/tmp/guard_$(basename "$script" .gd).txt"
            if [ "${1:-}" = "--no-path" ]; then
              $GODOT --headless --script "$script" 2>&1 | tee "$LAST_LOG"
            else
              $GODOT --headless --path . --script "$script" 2>&1 | tee "$LAST_LOG"
            fi
          }

          verdict() {       # <script> <passed 0|1>
            if [ "$2" -eq 0 ]; then
              echo "PASS  $1"
            else
              echo "FAIL  $1"
              failed+=("$1")
            fi
            echo "::endgroup::"
          }

          # A Godot guard of the "todo OK" shape. Requires BOTH the marker and
          # a clean exit - the marker alone would pass a guard that printed it
          # and then crashed on a later check.
          guard_godot() {   # <script> [--no-path]
            local script="$1"
            ran=$((ran + 1))
            echo "::group::$script"
            run_godot "$@"
            local status=$?
            if [ "$status" -eq 0 ] && grep -q "todo OK" "$LAST_LOG"; then
              verdict "$script" 0
            else
              verdict "$script" 1
            fi
          }

          # A Godot guard that reports by exit code and prints no marker.
          #
          # This shape was missed when the 37 steps were consolidated, and it
          # cost a red build: verify_hardcoded_uids.gd prints "OK: every bare
          # uid:// reference resolves." and quits 0, so a grep for "todo OK"
          # called a passing guard failed. The consolidation was verified
          # against fake guards of the two shapes it knew about, which is
          # exactly why it could not find the third.
          guard_godot_exit() {  # <script> [--no-path]
            local script="$1"
            ran=$((ran + 1))
            echo "::group::$script"
            run_godot "$@"
            verdict "$script" $?
          }

          guard_python() {  # <script>
            local script="$1"
            ran=$((ran + 1))
            echo "::group::$script"
            if python3 "$script" 2>&1; then
              echo "PASS  $script"
            else
              echo "FAIL  $script"
              failed+=("$script")
            fi
            echo "::endgroup::"
          }

          # === Verify the first-run notice only shows on a cold shader cache
          # The first launch after installing is a different experience, not a
          # slightly slower one: 52014ms of load plus 30089ms of precache on
          # the same phone that does 5998 + 1270 on its second launch, with
          # bench comparable and the SAME pipeline count. A minute and a half
          # of loading screen with no explanation reads as a hang.
          guard_godot tools/test_first_run_notice.gd

          # === Verify Chimera's house is off the depth pre-pass
          # transparency = 4 draws the surface twice and leaves it in the
          # transparent queue, where nothing behind it can be depth-rejected.
          # Measured on the device's renderer path at 3.86x ALPHA_SCISSOR with
          # byte-identical draw/primitive/object counts - which is why no
          # count-based reading of a device log could ever find it.
          guard_python tools/audit_house_transparency.py

          # === Verify the alley background stays merged and reproducible
          # Safety Lullaby's Parallax2 drew seven full-size sprites on one
          # scroll factor - seven texture binds and their overlaps filled
          # 10.6M world pixels where the union is 7.5M. back_merged.png bakes
          # them into one 1824x864 texture, verified pixel-identical (worst
          # error 0/255 in six 1:1-texel crops on the real render path). The
          # guard re-runs the bake and demands byte-equality, so a source PNG
          # or scene position changing without a rebake fails here instead of
          # silently desyncing the background. Lamp1 stays out of the merge:
          # it carries lamp_flicker.gd and the three pole lights.
          guard_python tools/audit_alley_merged_background.py

          # === Verify the console's icon materials are off any alpha mode
          # mat_console_inactive/select/idle drive the shop's Home tab icon
          # models, inside the SubViewport already measured as the single
          # most expensive one in the shop. All three shipped
          # ALPHA_DEPTH_PRE_PASS over textures with no real transparency to
          # draw (worst texel is compression noise at 254/255) - free money,
          # no threshold to tune, unlike a scissor conversion.
          guard_python tools/audit_console_icon_materials.py

          # === Verify every precompiled sidecar describes its own source
          # Godot reads a sidecar's source_md5 back to decide whether to
          # reimport, so one that carries a different file's hash makes it
          # skip a texture that really did change and ship the stale .res.
          # Nothing fails; the symptom is a wrong texture on a phone.
          #
          # The harvester used to find its output by scanning for anything
          # starting with "<basename>-" and taking the first hit, and nine
          # file names in this project appear more than once across 26 files
          # (spritemap1.png nine times, grass.png three). A run rewrote
          # serena/Running/grass.png's sidecar with the hash of
          # intro/opening_shot/grass.png.
          #
          # This runs after the harvest step on purpose: a harvest build is
          # exactly when a sidecar can be written wrong, and this is the pass
          # that would have caught it.
          guard_python tools/audit_precompiled_sidecars.py

          # === Verify the diagnostics log's format strings
          # A GDScript format string with more placeholders than arguments
          # does not raise and does not stop the game: `String % Array`
          # returns the string unformatted. The log then writes
          # "ram=%s gpu=%.2fms ..." for every line of the session and looks
          # like a working file until someone parses it. One build and one
          # play session were lost to exactly that.
          guard_python tools/verify_log_format.py

          # === Verify the memory trace survives a blocked main thread
          # The trace exists to record what happens inside
          # change_scene_to_packed(), which blocks the main thread for the
          # whole of its work - so "does it write a file" is not the property
          # worth checking. The test blocks its own thread with
          # OS.delay_msec() and counts the samples that land during the
          # freeze. If that ever stops holding, the next device log comes back
          # empty at exactly the moment it was collected for.
          guard_godot tools/test_memory_sampler.gd

          # === Verify the region probes attribute to the subtree that spends
          # The whole rest= split rests on one engine behaviour: a probe hung
          # as the last child runs after the subtree before it. If that stopped
          # holding the split would not be imprecise, it would be false -
          # charging one subtree for another's cost. rest= has already misled
          # this project once, when most of it turned out to be the instrument
          # itself, so this one is measured against real burns.
          guard_godot tools/test_script_regions.gd

          # === Verify a muted effect rect does not come back on its own
          # The setting strips the shader and hides the rect, but hiding once
          # only holds for a node nothing animates. Chimera's UILayer/NTSC is
          # authored visible=false and four animation tracks switch it on
          # mid-song, so with sha_fx=off it drew a materialless transparent
          # ColorRect over the whole screen - measured in the device log at
          # over=5.1x with NTSC and Rain both at alpha 0.
          guard_godot tools/test_effect_rect_stays_muted.gd

          # === Verify the shop's raycast is not rewritten every physics step
          # target_position and collision_mask both dirty the RayCast3D and
          # re-register it with PhysicsServer3D, so writing them unchanged
          # costs the same as writing them changed - thirty times a second
          # while the player stands still. The device log measures the shop at
          # phys=5.16ms with physn=1 and ten collision pairs of boxes and
          # capsules, which is not what ten pairs cost.
          guard_godot tools/test_shop_raycast_writes.gd

          # === Verify drift correction cannot loop
          # A Theora seek walks back through the file in 512 KB blocks looking
          # for the previous keyframe. Tightening max_drift to 0.05 to cure an
          # audible desync closed a loop - seek, longer frame, more drift,
          # another seek - and the device log measured the component's region at
          # PhotoshootVideo=23.31ms average against the ~3.1ms decoding
          # 960x540 costs. The ceiling does not depend on picking a good
          # threshold.
          guard_godot tools/test_video_seek_ceiling.gd

          # === Verify the pause menu sleeps its children, not itself
          # 37 of 37 nodes processing behind a closed menu, because the script
          # node needs process_mode = ALWAYS to hear the pause key while the
          # tree is paused and its children inherit it. Disabling the script
          # node instead would save the same and leave the game unpausable,
          # with no error anywhere.
          guard_godot tools/test_pause_children_sleep.gd

          # === Verify the outgoing scene is torn down before the new load
          # unload_current_scene() is a queue_free, so requesting the load on
          # the next line ran destruction and loading at once, fighting over
          # the render server's queue. Measured: leaving intro.tscn loads in
          # 5.3s with no stall; leaving the shop or Chimera stalls 9-11s at a
          # fixed dependency count. Checked as an ORDER, because that is what
          # can be asserted without a phone, and a refactor moving the request
          # up would cost ten seconds again with no error anywhere.
          guard_godot tools/test_teardown_before_load.gd

          # === Verify F only appears while navigating console sections
          # F switches the cartridge, which means something only while moving
          # between the console's sections - and that is the only place the F
          # prompt is drawn. It was wired to nothing and showed always.
          guard_godot tools/test_console_section_nav.gd

          # === Verify the action column closes its gaps
          # The four contextual buttons are pinned to absolute slots, so
          # hiding one leaves a 190px hole and moves nothing. PowerButton
          # already hides itself correctly through visible_source; the hole is
          # what the player sees. Nothing may move while all four are shown.
          guard_godot tools/test_action_column.gd

          # === Verify Enter only shows while it confirms something
          # One button, two jobs: a menu ui_accept, or an aim-and-click at the
          # 3D world through MouseController's raycast. Only the second one can
          # be pointed at nothing. Hiding it inside a menu would strand the
          # player there, so "not casting means always available" is the line.
          guard_godot tools/test_confirm_available.gd

          # === Verify the D-pad hides the directions that do nothing
          # Disabled arms used to be drawn at a quarter alpha, which reads as
          # temporarily unavailable - they are not. The outline was a hardcoded
          # twelve-point plus, so it would have gone on tracing four arms
          # around two, which is worse than the dim arrow was.
          guard_godot tools/test_dpad_zone_shape.gd

          # === Verify both vertical-only slots
          # The notepad reads ui_up/ui_down/ui_accept and nothing else, so its
          # two horizontal arrows have never done anything. An empty slot has
          # to mean "no opinion" rather than false, or the second one pins the
          # pad open and the SHOP/TALK sign loses its own restriction.
          guard_godot tools/test_vertical_only_slots.gd

          # === Verify leaving an area drops its focus
          # CollectorShop.current_area only changed when another area took
          # focus, so the last one entered kept is_focused true for the rest
          # of the visit. Power is gated on FocusAreaRight.is_focused and F on
          # Console.focused, which FocusArea3D's setter is what drops - a
          # device screenshot has both showing while the player walks the room.
          guard_godot tools/test_focus_clears_on_free_look.gd

          # === Verify the reveal pacer backs off on an expensive frame
          # It steered on Performance.TIME_PROCESS, a maximum over the last
          # second refreshed once a second - so it never saw a spike, never
          # halved, climbed to MAX_BATCH and put 64 nodes on one frame.
          # Entering the shop compiles 212 pipelines and the batch landing 47
          # of them took 6981ms, past the five seconds Android calls
          # unresponsive. The test blocks the main thread for real.
          guard_godot tools/test_preload_batch_backoff.gd

          # === Verify the precache sweep is driven by the reveal, not the clock
          # An AnimationPlayer advances by delta, so the 0.8s sweep ends in four
          # or five frames while the reveal it is meant to accompany takes 6737ms
          # on Chimera. Everything revealed after that was drawn from one fixed
          # pose - the file's own diagnosis, left half-fixed by 67c9fad. The
          # poses are re-served per revealing frame now; this pins that they are
          # collected, that they cycle, that a scene without a sweep still loads,
          # and that nothing is served while the animation still owns the
          # transform.
          guard_godot tools/test_preload_sweep.gd

          # === Verify the precache sweep also visits the stalling cutscenes
          # 122_fall@6.8s still costs frame=1911.7ms for spec+8 with RAM/VRAM
          # flat - a pipeline-compile stall, not loading. Three more sequences
          # show the same shape. All four are shots the precache's own sweep
          # never visited, because that sweep only cycles through the
          # viewpoints its own animation authors - a mesh can be
          # visible=true the whole loading screen and never get drawn if the
          # camera never points at it, and an undrawn material never
          # compiles. extra_sweep_animations folds each sequence's own camera
          # track into the cycling sweep. Unverified on device - it changes
          # which frame a pipeline first compiles on, not whether it does; a
          # fresh log's pipe= on these four sequences is what confirms it.
          guard_godot tools/test_preload_extra_sweep.gd

          # === ...and that the sweep actually REACHES the sequences it folded
          # The step above proves the eight sequences are collected. It does not
          # prove any of them is served, and on Chimera six of the eight never
          # were: 82 poses collected, 30 revealing frames to show them, served in
          # append order, so the cursor stopped two poses short of the end of
          # 122_fall and 107_turnaround onward got nothing - including
          # 121_closetrunout and 114_hexapproach, two of the four stalls the
          # export above exists to fix. Both numbers are in one line of the
          # device log (barrido=82 poses ... extra=30 frames), which is why it
          # read as healthy for as long as it did. Round-robin across the source
          # animations now, plus a bounded tail after the reveal. This guard runs
          # the real order and asserts the prefix property, and pins the old
          # behaviour (3 groups of 9) so the regression cannot come back quietly.
          guard_godot tools/test_sweep_covers_every_sequence.gd

          # === The other half of the same stall: the lights, and their order
          # The viewpoints alone did not do it. The lighting state is part of
          # the pipeline key, so a sweep run with the sequence's lights off
          # compiles the wrong variant of every surface it points at, and
          # 104_photographysesh pays 736ms + 1662ms for 37 pipelines on its
          # first two frames. Switching those four lights on for the sweep is
          # the fix; doing it BEFORE the hide is what took Chimera's precache
          # from 15092ms to 38530ms in af85b29 and got reverted. This pins the
          # order, and that the mechanism stays at the RenderingServer.
          guard_godot tools/test_lit_precache.gd

          # === Safety Lullaby's pendulum has to stay tappable when the HUD goes
          # The hitbox followed DefaultHUD's modulate, which is right for a HUD
          # element and wrong for the only input a touch device has. The song's
          # own Timeline runs the pendulum from 160.04s to 194.37s with the HUD
          # keyed to alpha 0 - thirty-four seconds where the mechanic kept
          # taking -15 retention per missed half measure and Android had no way
          # to answer. This recomputes that window from the scene and pins that
          # the rule is the mechanic, not the HUD.
          guard_godot tools/test_pendulum_hitbox_window.gd

          # === El render scale tiene que llegar a los SubViewport en contenedor
          # _scale_subviewport escalaba escribiendo viewport.size, y un
          # SubViewportContainer con stretch lo reescribe en el acto - asi que
          # el ajuste nunca llego a ninguno. Los dos de la consola son 720x540
          # y el log los mide vivos a ese tamano mientras todo lo demas corre a
          # 0.50: 0.78 de los 1.38 Mpx que cuestan los SubViewport de la tienda
          # con la consola abierta, que es lo que la pasa de 16.90ms a 20.75ms
          # y parte los frames entre 12-20ms y 28-40ms.
          guard_godot tools/test_subviewport_container_scale.gd

          # === Las luces 2D, que ningun contador de este log veia
          # lights= es solo Light3D, asi que Safety Lullaby - con cinco
          # PointLight2D en el decorado - reportaba lights=0 en todos sus
          # censos. Y over= no puede cubrirlo: el renderizador de canvas dibuja
          # cada item otra vez por cada luz, asi que una luz a pantalla completa
          # duplica el relleno sin sumar un solo item. BG/BgLight es 1049x480
          # con texture_scale 4.0, o sea 4196x1920 sobre un escenario de
          # 1920x1080.
          guard_godot tools/test_light2d_census.gd

          # === Safety Lullaby: apagar las luces 2D opcionales en Very Low
          # Ningun preset llegaba a esta cancion porque no tiene 3D. Las luces
          # 2D multiplican el relleno (un item se redibuja por cada luz que lo
          # toca) y el callejon tiene cuatro, una cubriendo el frame entero.
          guard_godot tools/test_2d_light_budget.gd

          # === Los botones RETRY/EXIT de las dos pantallas de muerte
          # Instancia las dos escenas y recorre la cadena entera: el nodo, la
          # propiedad que la abre, los botones, sus acciones, que la pantalla
          # las maneja y que la capa no los entierra. Ninguno de esos fallos
          # da error - dejan una pantalla de la que no se puede salir.
          guard_godot tools/test_gameover_prompt_usable.gd

          # === Los creditos se reproducen una vez, y se pueden saltar
          # credits_scroll_seen solo se escribia al terminar la animacion del
          # angel, asi que cerrar la app a medias los repetia tras el siguiente
          # clear. Y el skip era ui_accept, que en un movil no existe.
          guard_godot tools/test_credits_once.gd

          # === Celebi tiene que irse cuando le ganas al tecleo
          # _autoplay_process escribe desde dentro de _process, asi que la
          # ultima letra lanzaba succeed() y el bloque de ticks pisaba la
          # animacion de salida con `ExportCelebi tick` - que acaba en su
          # ultimo frame y mantiene ../Darkness en alpha 0.652. Solo autoplay
          # lo alcanza, o sea Showcase.
          guard_godot tools/test_celebi_leaves.gd

          # === Showcase tiene que mostrar Y jugar los controles de Chimera
          # El D-pad de escape rechazaba autoplay a secas (quinta copia de la
          # regla que LullabyShowcase existe para tener una sola vez) y no
          # aparecia nunca. Y flash_control solo sabia de RubiconActionButton y
          # RubiconMechanicHitbox, mientras la escena cablea Button pelados: no
          # entraba por ninguna rama y no hacia nada, en silencio.
          guard_godot tools/test_showcase_chimera_controls.gd

          # === Verify a connected gamepad works without visiting the console
          # The lanes came from default_input_map.tres, which is D/F/J/K and
          # nothing else, and project.godot's whole [input] block had zero
          # InputEventJoypad. Godot covers ui_left/right/up/down with the D-pad
          # but NOT ui_accept or ui_cancel - Enter/Kp Enter/Space and Escape -
          # so a pad could move through every menu and neither confirm nor go
          # back, and could not hit a note. The ui_ ones are added at runtime
          # because overriding a built-in action in project.godot replaces its
          # whole event list, which would take the keyboard off ui_accept.
          guard_godot tools/test_gamepad_defaults.gd

          # === Verify the shop's aim field can name the reported bug
          # "no puedo apuntar al sombrero del coleccionista, siempre es al
          # medio", and three readings of the scene were wrong before this
          # field existed. Ruled out with numbers: the hat is on the same
          # collision layer as the Kollectadex and the board, both desk
          # animations set its can_interact true, and through the desk camera
          # pose its box is 7.5% of the screen, clear above the Collector. The
          # same projection says the screen centre hits neither of them, so
          # `centrada` with `obj=-` on a FOCUSED line is the signature to look
          # for - the tap never reached _unhandled_input.
          guard_godot tools/test_aim_field.gd

          # === Verify no translation lost a placeholder or a tag
          # A missing translation falls back to English and is harmless. One
          # that dropped a %d does not: the score screen's format strings
          # throw at runtime rather than falling back. Same for $SPECIAL,
          # which LullabyInputBinds rewrites into the bound button, and for
          # the lyrics, which are almost entirely BBCode.
          guard_python tools/audit_translation_csv.py

          # === Verify the cached hit order matches the sorted one
          # update_performance() rebuilt and re-sorted every result hit so far
          # once per note that lands - O(n log n) per note. Monochrome's log
          # measured the lanes' _process growing 1.0ms -> 19.9ms across one
          # run. The array is kept now, which is only safe because it holds
          # order and never values, so this compares it against the old
          # build-and-sort at every step of a run with misses, holds and a
          # rewind in it.
          guard_godot tools/test_perf_order_cache.gd

          # === Verify one symbol's frame does not rebuild the whole atlas
          # use_backbuffer_cache and backbuffer_cache used to live on the
          # AnimateAtlas, which every symbol naming that folder shares. One
          # symbol advancing a frame cleared the flag for all of them and sent
          # the lot down the full rebuild path - Monochrome measured 480
          # rebuilds in a second against 1665 cached draws, anim2d 371ms/s.
          guard_godot tools/test_atlas_cache_per_symbol.gd

          # === Verify settings do not re-send unchanged shadow state
          # Every settings row calls apply_settings() on every change, and the
          # device log has each one compiling 35 pipelines with an identical
          # breakdown - surf+6 draw+13 spec+16 - so the same shaders are being
          # rebuilt. The shadow writes are the only ones in that function
          # Godot does not filter for you.
          guard_godot tools/test_settings_shadow_reapply.gd

          # === Verify the quality ladder actually gets cheaper each step
          # qol_very_low shipped render_scale = 0.70 against Low's 0.65: the
          # emergency preset rendered MORE 3D pixels than the one above it. On
          # the user's g53 the measured model is gpu = 5.7ms + 90.8ms x Mpx3d,
          # so that step was 57.0ms (17.6fps) where Low was 49.9ms. Fourth time
          # a preset did not lower what it claimed to; the other three are in
          # CLAUDE.md and were all found by reading code months late.
          guard_godot tools/test_preset_ladder.gd

          # === Verify the baked-light cull only ever hides what the bake carries
          # Chimera's frame is 90% the 3D pass and 90.8 ms/Mpx is what six
          # lights per fragment cost on this path. Its own log does the A/B:
          # the closet shots have three lights reaching the camera and cost
          # 33.5ms, the wide shots have four and cost 57-59ms, and the fourth is
          # MoonSpotlight - BAKE_STATIC, so already inside chimera_base.lmbake.
          # The pass refuses to act without a LightmapGI holding real light
          # data, because hiding baked lights on a bake that failed to load is
          # the eleven-day black house all over again.
          guard_godot tools/test_baked_light_cull.gd

          # === Verify the dark-light cull waits before pulling a light
          # A cull mask of 0 takes the light out of the set the renderer pairs
          # with each instance, and in Forward Mobile the light count is part
          # of every covered surface's specialization key - the isolated bench
          # measures three fresh pipelines for adding a light and three more
          # for removing it again. Chimera's camera flash crosses zero seven
          # times in one 8.5s clip, so the pass re-specialized twenty-six
          # freshly revealed meshes twice: spec+31, +6, +1 with vram flat and
          # the geometry counters byte-identical. Two seconds of freeze when
          # Serena takes the photo. A holdoff and not an exemption, because a
          # light parked at zero is still worth culling - TvLight sits there
          # for the whole 78s of prelude with omni_range 43.9.
