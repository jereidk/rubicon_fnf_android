name: Android Build

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: >-
          release uses Godot's release engine template; debug uses the debug
          one. Both are signed with the same release keystore afterwards, so
          both install as updates over each other.
        required: false
        default: 'release'
        type: choice
        options:
          - release
          - debug
      precompile_match:
        description: >-
          Leave empty for a normal build. Set to one or more space-separated
          globs to also harvest the imports they match into
          precompiled_astc_imports/ and commit them to this branch, e.g.
          *_packed_*.png  or  loading.png nte_default.png
        required: false
        default: ''

permissions:
  contents: read
  packages: none
  security-events: none
  attestations: none
  statuses: none

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: '4.7.1-stable'
  GODOT_VERSION_FOLDER: '4.7.1.stable'
  JAVA_VERSION: '21'
  ANDROID_API: '34'
  ANDROID_BUILD_TOOLS: '34.0.0'
  ANDROID_NDK: '26.1.10909125'
  DEBIAN_FRONTEND: 'noninteractive'
  ACTIONS_RUNNER_DEBUG: 'true'

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    # Only so the harvest step below can push what it collected. Every other
    # step in this job reads.
    permissions:
      contents: write

    steps:
      # Pointers only, deliberately. Every LFS object inside the sparse
      # checkout is a precompiled import - about 398MB of them - and smudging
      # on checkout spends that much LFS bandwidth on every single run. Three
      # runs is past the 1GB a month the free allowance gives, which is
      # exactly what took build #109 down before it reached step 3:
      #
      #   batch response: This repository exceeded its LFS budget.
      #
      # The objects are fetched below instead, from a cache when there is one.
      - name: Checkout repository
        uses: actions/checkout@v4
        env:
          GIT_LFS_SKIP_SMUDGE: 1
        with:
          lfs: false
          sparse-checkout: |
            /*
            !/lullaby_mod/original_pck/
          sparse-checkout-cone-mode: false

      - name: Cache Git LFS objects
        id: cache-lfs
        uses: actions/cache@v4
        with:
          path: .git/lfs/objects
          # A skipped smudge leaves each file as its pointer, and a pointer is
          # literally the object's oid, so hashing them keys the cache on the
          # LFS content itself and on nothing else. Editing a .gd or a .tscn
          # does not move this key; adding a precompiled import does.
          key: lfs-${{ runner.os }}-${{ hashFiles('precompiled_astc_imports/*.res', '**/*.lmbake', '**/*.ctex') }}

      - name: Materialise Git LFS files
        run: |
          # Nothing in LFS is required any more. The only game assets that were
          # behind it - two lightmap bakes, 510KB together - are plain git
          # objects now; everything left is precompiled import output, which is
          # a build accelerator. So an LFS outage has to degrade this job, not
          # end it, and `git lfs pull` failing is not fatal.
          #
          # checkout, not pull, when the objects are already local: it smudges
          # out of .git/lfs/objects and never contacts the server, so a warm
          # cache costs zero bandwidth. Only a miss pays for a fetch.
          if [ "${{ steps.cache-lfs.outputs.cache-hit }}" = "true" ]; then
            echo "LFS cache hit - materialising from local objects"
            git lfs checkout || echo "::warning::git lfs checkout fallo"
          else
            echo "LFS cache miss - fetching from the server"
            git lfs pull || echo "::warning::git lfs pull fallo (presupuesto agotado?)"
          fi

          # Whatever is still a pointer is unusable, and has to be named rather
          # than fed to Godot: the restore step below would otherwise copy 130
          # bytes of text into .godot/imported/ as though it were a compressed
          # texture. Counted here, skipped there.
          pointers=0
          for f in $(git lfs ls-files -n); do
            [ -f "$f" ] || continue
            if head -c 64 "$f" | grep -q "git-lfs.github.com/spec"; then
              pointers=$((pointers + 1))
            fi
          done

          total=$(git lfs ls-files -n | wc -l)
          echo "LFS: $((total - pointers))/$total materializados, $pointers sin resolver"
          if [ "$pointers" -gt 0 ]; then
            echo "::warning::$pointers objetos LFS sin resolver - se importara desde las fuentes"
            echo "### LFS degradado" >> "$GITHUB_STEP_SUMMARY"
            echo "$pointers de $total objetos no se pudieron descargar." >> "$GITHUB_STEP_SUMMARY"
            echo "El build continua reimportando desde las fuentes: mas lento, mismo resultado." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION_FOLDER }}
          key: godot-${{ runner.os }}-${{ env.GODOT_VERSION }}

      - name: Download Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION_FOLDER }}
          wget -q https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}/Godot_v${{ env.GODOT_VERSION }}_export_templates.tpz -O /tmp/templates.tpz
          unzip -q /tmp/templates.tpz -d ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION_FOLDER }}
          mv ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION_FOLDER }}/templates/* ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION_FOLDER }}/
          rm -rf ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION_FOLDER }}/templates
          rm /tmp/templates.tpz

      - name: Cache Godot binary
        id: cache-godot-bin
        uses: actions/cache@v4
        with:
          path: |
            /opt/godot
          key: godot-bin-${{ runner.os }}-${{ env.GODOT_VERSION }}

      - name: Download Godot binary
        if: steps.cache-godot-bin.outputs.cache-hit != 'true'
        run: |
          mkdir -p /opt/godot
          wget -q https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}/Godot_v${{ env.GODOT_VERSION }}_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /opt/godot
          chmod +x /opt/godot/Godot_v${{ env.GODOT_VERSION }}_linux.x86_64
          rm /tmp/godot.zip
          ln -sf /opt/godot/Godot_v${{ env.GODOT_VERSION }}_linux.x86_64 /opt/godot/godot

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Cache Android SDK
        id: cache-android-sdk
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/sdk
          key: android-sdk-${{ runner.os }}-${{ env.ANDROID_API }}-${{ env.ANDROID_BUILD_TOOLS }}-${{ env.ANDROID_NDK }}
          restore-keys: |
            android-sdk-${{ runner.os }}-

      - name: Setup Android SDK
        if: steps.cache-android-sdk.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.android/sdk/cmdline-tools
          cd ~/.android/sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip
          mv cmdline-tools latest
          rm cmdline-tools.zip

      - name: Accept Android licenses
        run: |
          yes | ~/.android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Install Android SDK components
        run: |
          ~/.android/sdk/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" \
            "platforms;android-${{ env.ANDROID_API }}" \
            "build-tools;${{ env.ANDROID_BUILD_TOOLS }}" \
            "ndk;${{ env.ANDROID_NDK }}"

      - name: Create ephemeral debug keystore
        run: |
          # This keystore only signs the intermediate build (below); it's
          # thrown away and doesn't matter which certificate it uses - the
          # APK actually shipped gets re-signed with the persistent release
          # keystore in "Sign APK with Release Keystore" further down, which
          # is what makes every build installable as an update over the
          # last one (Android requires the same certificate across updates).
          mkdir -p ~/.android
          keytool -genkeypair -v \
            -keystore ~/.android/debug.keystore \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            2>/dev/null

      - name: Restore release keystore
        run: |
          mkdir -p ~/.android
          echo "${{ secrets.KEYSTORE_FILE }}" | base64 -d > ~/.android/release.keystore

      - name: Configure environment
        run: |
          echo "ANDROID_HOME=$HOME/.android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$HOME/.android/sdk" >> $GITHUB_ENV
          # Find Java installed by setup-java
          JAVA_DIR=$(find /opt/hostedtoolcache/Java_Temurin-JDK -maxdepth 1 -type d -name "*${{ env.JAVA_VERSION }}*" 2>/dev/null | head -1)
          if [ -n "$JAVA_DIR" ]; then
            JAVA_HOME_DIR="$JAVA_DIR/x64"
          else
            # Fallback: use java from PATH and get its parent directory
            JAVA_BIN=$(which java 2>/dev/null)
            JAVA_HOME_DIR=$(dirname $(dirname $JAVA_BIN) 2>/dev/null)
          fi
          echo "JAVA_HOME=${JAVA_HOME_DIR}" >> $GITHUB_ENV
          echo "GODOT=/opt/godot/godot" >> $GITHUB_ENV

      - name: Print environment
        run: |
          echo "Java version:"
          java -version 2>&1 | head -1
          echo ""
          echo "JAVA_HOME=${JAVA_HOME}"
          echo ""
          echo "Android SDK components:"
          ~/.android/sdk/cmdline-tools/latest/bin/sdkmanager --list_installed 2>/dev/null | grep -E "platforms|build-tools|ndk" || true
          echo ""
          echo "Godot version:"
          $GODOT --version || echo "Godot not found"

      - name: Cache Godot import cache
        uses: actions/cache@v4
        with:
          path: |
            .godot/imported
            .godot/uid_cache.bin
          # restore-keys previously got removed here on the theory that a
          # prefix-match fallback (serving the *closest* previous cache on
          # an exact-key miss) was why the shop scene crashed twice with
          # "Failed to load resource uid://..." - the idea being Godot's
          # incremental reimport on top of that stale base doesn't reliably
          # re-persist freshly-registered UIDs to uid_cache.bin before the
          # next (separate) $GODOT process reads it back.
          #
          # That theory doesn't hold up: a build with restore-keys fully
          # removed (an exact-key miss, genuinely empty .godot/imported,
          # the "safe" cold-import case this was supposed to guarantee) hit
          # the exact same crash again - Import step resolved every
          # ext_resource fine, Export step failed the same uid_cache
          # lookups regardless. Whatever's actually causing the export-time
          # UID gap, it isn't restore-keys - that fix never got validated
          # against a real build before being trusted. Restoring
          # restore-keys here so commits that don't touch a hashed file get
          # a useful partial cache instead of a full cold rebuild every
          # time.
          key: godot-import-v5-${{ runner.os }}-${{ env.GODOT_VERSION }}-${{ hashFiles('**/*.png', '**/*.jpg', '**/*.ogg', '**/*.wav', '**/*.mp3', '**/*.gltf', '**/*.glb', '**/*.ttf', '**/*.otf', '**/*.tres', '**/*.tscn', '**/*.gd', '**/*.gd.uid', 'project.godot') }}
          restore-keys: |
            godot-import-v5-${{ runner.os }}-${{ env.GODOT_VERSION }}-

      - name: Restore precompiled ASTC imports
        run: |
          # These are pre-run outputs of the two custom ASTC import plugins
          # (astc_sprite_import, astc_normal_map), committed to the repo
          # instead of relying solely on the GitHub Actions cache above -
          # EXHAUSTIVE-quality ASTC compression across ~124 large textures
          # takes over an hour, and the Actions cache key changes (forcing a
          # cache miss) any time any tracked png/tscn/etc anywhere in the
          # project changes. Godot decides whether to skip reimporting a
          # file by comparing content MD5s (source PNG vs the .md5 sidecar's
          # source_md5, and the .res output vs its dest_md5) rather than
          # file timestamps, so this works correctly even on a fresh
          # checkout where every file's mtime is "now". See
          # precompiled_astc_imports/README.md for how to regenerate these.
          #
          # Each .res is only copied when it is real content. An unresolved LFS
          # pointer here is 130 bytes of text, and handing that to Godot as a
          # compressed texture is worse than not having it: skipping lets the
          # importer notice the output is missing and rebuild it from the PNG,
          # which is slow but correct. The .md5 sidecar only travels with a
          # .res that was actually copied - on its own it would tell Godot the
          # import is already done and there is nothing to rebuild.
          mkdir -p .godot/imported
          copied=0
          skipped=0
          for res in precompiled_astc_imports/*.res; do
            [ -f "$res" ] || continue
            if head -c 64 "$res" | grep -q "git-lfs.github.com/spec"; then
              skipped=$((skipped + 1))
              continue
            fi
            cp "$res" .godot/imported/
            md5="${res%.res}.md5"
            [ -f "$md5" ] && cp "$md5" .godot/imported/
            copied=$((copied + 1))
          done
          echo "Restored $copied precompiled ASTC imports ($skipped sin resolver)"
          if [ "$skipped" -gt 0 ]; then
            echo "::warning::$skipped imports precompilados no disponibles - Godot los rehara"
          fi

      - name: Restore precompiled lightmap imports
        run: |
          # Same idea as the ASTC step above, for the project's 3 baked
          # LightmapGI .exr files - Godot's own stock 2d_array_texture
          # importer, not the custom ASTC plugins, but disproportionately
          # slow on its own (one of them, chimera_base.exr, is ~11% of the
          # whole Import step by itself: an uncompressed HDR source
          # compressed twice, once for BPTC and once for ASTC). See
          # precompiled_lightmap_imports/README.md for how to regenerate.
          mkdir -p .godot/imported
          cp precompiled_lightmap_imports/*.ctexarray precompiled_lightmap_imports/*.md5 .godot/imported/
          echo "Restored $(ls precompiled_lightmap_imports/*.md5 | wc -l) precompiled lightmap imports"

      - name: Restore precompiled texture imports
        run: |
          # Same idea as the two steps above, for individually slow plain PNGs
          # on Godot's stock texture importer (not either custom ASTC plugin).
          #
          # This directory can legitimately be empty: moving a texture onto the
          # ASTC importer makes its .ctex here stale - the .import now expects a
          # .res - so the pair has to be deleted, and everything it used to hold
          # has been. The glob must not be allowed to fail the build when that
          # happens, which is what an unguarded `cp *.ctex` does.
          mkdir -p .godot/imported
          shopt -s nullglob
          files=(precompiled_texture_imports/*.ctex precompiled_texture_imports/*.md5)
          if [ ${#files[@]} -gt 0 ]; then
            cp "${files[@]}" .godot/imported/
          fi
          echo "Restored $(ls precompiled_texture_imports/*.md5 2>/dev/null | wc -l) precompiled texture imports"

      - name: Build ASTC normal map compressor
        run: |
          cd tools/astc_compress
          g++ -O2 -std=c++17 -pthread -I thirdparty/astcenc astc_compress.cpp thirdparty/astcenc/astcenc_*.cpp -o astc_compress
          chmod +x astc_compress
          cd ../..
          ls -la tools/astc_compress/astc_compress

      - name: Import Godot project
        run: |
          # Run twice: a single --import pass can leave resources generated
          # mid-scan (e.g. GLTF-embedded material/texture sub-resources)
          # registered on disk but not yet committed to Godot's UID cache,
          # so a dependent scene referencing them by UID fails to resolve
          # until a second pass, where everything is already up to date and
          # this repeats the scan just to finish registering those UIDs.
          # Godot's own CI docs recommend this for exactly this class of
          # "works in editor, breaks in --headless export" issue.
          $GODOT --headless --import 2>&1
          $GODOT --headless --import 2>&1

      - name: Harvest precompiled imports and commit them
        if: ${{ inputs.precompile_match != '' }}
        run: |
          # Why this runs here rather than on someone's machine: the .res
          # files are LFS objects, and the only place that reliably has both
          # a full checkout and permission to upload them is this runner.
          #
          # And why it is worth having at all - measured on run 31320235299,
          # which was a normal build of 37m42s:
          #
          #   Import Godot project   34m33s   (92% of the wall clock)
          #   of which _packed_      34m33s   (100% of the reimports)
          #
          # Godot reimported 51 files that run. 48 were the atlas sheets
          # b26ade9 repacked, at 55-107s each, because nothing had ever
          # committed their compiled output. Everything else in the project
          # came out of the Actions cache untouched. Filling those 48 in
          # takes the build to roughly four minutes.
          #
          # The harvest reads .godot/imported directly rather than an
          # exported APK, so it does not depend on the export succeeding and
          # cannot pick up a stale artifact - the import that produced these
          # files ran seconds ago, in this job, from this commit.
          # Space-separated, so one build can harvest textures that share no
          # glob. loading.png and nte_default.png are the case that forced
          # this: they live in different trees and the only fnmatch pattern
          # covering both also covers half the project, so a single --match
          # meant two full builds to collect two files. The script already
          # accepts --match more than once; only this line did not.
          #
          # Unquoted on purpose - word splitting is the feature here. The
          # values are globs the operator typed into workflow_dispatch, and
          # the loop passes each as one argument, so a pattern still cannot
          # turn into anything but a --match value.
          MATCH_ARGS=""
          for pat in ${{ inputs.precompile_match }}; do
            MATCH_ARGS="$MATCH_ARGS --match $pat"
          done
          # shellcheck disable=SC2086
          python3 tools/harvest_precompiled_imports.py .godot/imported $MATCH_ARGS

          if [ -z "$(git status --porcelain -- precompiled_astc_imports)" ]; then
            echo "Nothing new to commit - everything matching is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Scoped to the one directory: the checkout is sparse, and a bare
          # `git add -A` in a sparse working tree is how you accidentally
          # commit the deletion of everything the sparse filter excluded.
          git add precompiled_astc_imports
          git commit -m "Precompile the imports matching ${{ inputs.precompile_match }}

          Harvested from .godot/imported by the build that produced them, so
          each .res is the output of the source PNG at this commit. The .md5
          sidecars are what Godot's reimport-skip check reads back.

          See tools/verify_precompiled_astc.gd to check the pairs."
          git push origin HEAD:${{ github.ref_name }}

      - name: Run the guard suite
        run: |
          # Every guard in this repo runs here, in one step.
          #
          # They were 37 separate steps, which made the workflow tedious to
          # read and added a step's worth of runner overhead 37 times over.
          # Consolidating them buys two things beyond the shorter list:
          #
          #   * ALL guards run even after one fails, so a red build names
          #     every problem at once instead of one per push-and-wait cycle.
          #   * Each guard's output is wrapped in a ::group::, so the log is
          #     collapsed by default and still one click from the detail.
          #
          # Two shapes of guard, both handled below: a Godot script that
          # prints "todo OK" on success, and a Python audit that just exits
          # non-zero. The reason each one exists stays in the comment above
          # its own line here, which is where it has always lived.
          #
          # Log files are named after the script rather than by hand - the
          # old steps had test_preload_sweep and test_retained_sweep both
          # writing /tmp/sweep.txt, which only worked because they were
          # separate steps.
          set +e
          set -o pipefail

          failed=()
          ran=0

          guard_godot() {   # <script> [--no-path]
            local script="$1"; shift
            local log="/tmp/guard_$(basename "$script" .gd).txt"
            ran=$((ran + 1))
            echo "::group::$script"
            if [ "${1:-}" = "--no-path" ]; then
              $GODOT --headless --script "$script" 2>&1 | tee "$log"
            else
              $GODOT --headless --path . --script "$script" 2>&1 | tee "$log"
            fi
            if grep -q "todo OK" "$log"; then
              echo "PASS  $script"
            else
              echo "FAIL  $script"
              failed+=("$script")
            fi
            echo "::endgroup::"
          }

          guard_python() {  # <script>
            local script="$1"
            ran=$((ran + 1))
            echo "::group::$script"
            if python3 "$script" 2>&1; then
              echo "PASS  $script"
            else
              echo "FAIL  $script"
              failed+=("$script")
            fi
            echo "::endgroup::"
          }

          # === Verify the first-run notice only shows on a cold shader cache
          # The first launch after installing is a different experience, not a
          # slightly slower one: 52014ms of load plus 30089ms of precache on
          # the same phone that does 5998 + 1270 on its second launch, with
          # bench comparable and the SAME pipeline count. A minute and a half
          # of loading screen with no explanation reads as a hang.
          guard_godot tools/test_first_run_notice.gd

          # === Verify Chimera's house is off the depth pre-pass
          # transparency = 4 draws the surface twice and leaves it in the
          # transparent queue, where nothing behind it can be depth-rejected.
          # Measured on the device's renderer path at 3.86x ALPHA_SCISSOR with
          # byte-identical draw/primitive/object counts - which is why no
          # count-based reading of a device log could ever find it.
          guard_python tools/audit_house_transparency.py

          # === Verify the console's icon materials are off any alpha mode
          # mat_console_inactive/select/idle drive the shop's Home tab icon
          # models, inside the SubViewport already measured as the single
          # most expensive one in the shop. All three shipped
          # ALPHA_DEPTH_PRE_PASS over textures with no real transparency to
          # draw (worst texel is compression noise at 254/255) - free money,
          # no threshold to tune, unlike a scissor conversion.
          guard_python tools/audit_console_icon_materials.py

          # === Verify every precompiled sidecar describes its own source
          # Godot reads a sidecar's source_md5 back to decide whether to
          # reimport, so one that carries a different file's hash makes it
          # skip a texture that really did change and ship the stale .res.
          # Nothing fails; the symptom is a wrong texture on a phone.
          #
          # The harvester used to find its output by scanning for anything
          # starting with "<basename>-" and taking the first hit, and nine
          # file names in this project appear more than once across 26 files
          # (spritemap1.png nine times, grass.png three). A run rewrote
          # serena/Running/grass.png's sidecar with the hash of
          # intro/opening_shot/grass.png.
          #
          # This runs after the harvest step on purpose: a harvest build is
          # exactly when a sidecar can be written wrong, and this is the pass
          # that would have caught it.
          guard_python tools/audit_precompiled_sidecars.py

          # === Verify the diagnostics log's format strings
          # A GDScript format string with more placeholders than arguments
          # does not raise and does not stop the game: `String % Array`
          # returns the string unformatted. The log then writes
          # "ram=%s gpu=%.2fms ..." for every line of the session and looks
          # like a working file until someone parses it. One build and one
          # play session were lost to exactly that.
          guard_python tools/verify_log_format.py

          # === Verify the memory trace survives a blocked main thread
          # The trace exists to record what happens inside
          # change_scene_to_packed(), which blocks the main thread for the
          # whole of its work - so "does it write a file" is not the property
          # worth checking. The test blocks its own thread with
          # OS.delay_msec() and counts the samples that land during the
          # freeze. If that ever stops holding, the next device log comes back
          # empty at exactly the moment it was collected for.
          guard_godot tools/test_memory_sampler.gd

          # === Verify F only appears while navigating console sections
          # F switches the cartridge, which means something only while moving
          # between the console's sections - and that is the only place the F
          # prompt is drawn. It was wired to nothing and showed always.
          guard_godot tools/test_console_section_nav.gd

          # === Verify the action column closes its gaps
          # The four contextual buttons are pinned to absolute slots, so
          # hiding one leaves a 190px hole and moves nothing. PowerButton
          # already hides itself correctly through visible_source; the hole is
          # what the player sees. Nothing may move while all four are shown.
          guard_godot tools/test_action_column.gd

          # === Verify Enter only shows while it confirms something
          # One button, two jobs: a menu ui_accept, or an aim-and-click at the
          # 3D world through MouseController's raycast. Only the second one can
          # be pointed at nothing. Hiding it inside a menu would strand the
          # player there, so "not casting means always available" is the line.
          guard_godot tools/test_confirm_available.gd

          # === Verify the D-pad hides the directions that do nothing
          # Disabled arms used to be drawn at a quarter alpha, which reads as
          # temporarily unavailable - they are not. The outline was a hardcoded
          # twelve-point plus, so it would have gone on tracing four arms
          # around two, which is worse than the dim arrow was.
          guard_godot tools/test_dpad_zone_shape.gd

          # === Verify both vertical-only slots
          # The notepad reads ui_up/ui_down/ui_accept and nothing else, so its
          # two horizontal arrows have never done anything. An empty slot has
          # to mean "no opinion" rather than false, or the second one pins the
          # pad open and the SHOP/TALK sign loses its own restriction.
          guard_godot tools/test_vertical_only_slots.gd

          # === Verify leaving an area drops its focus
          # CollectorShop.current_area only changed when another area took
          # focus, so the last one entered kept is_focused true for the rest
          # of the visit. Power is gated on FocusAreaRight.is_focused and F on
          # Console.focused, which FocusArea3D's setter is what drops - a
          # device screenshot has both showing while the player walks the room.
          guard_godot tools/test_focus_clears_on_free_look.gd

          # === Verify the reveal pacer backs off on an expensive frame
          # It steered on Performance.TIME_PROCESS, a maximum over the last
          # second refreshed once a second - so it never saw a spike, never
          # halved, climbed to MAX_BATCH and put 64 nodes on one frame.
          # Entering the shop compiles 212 pipelines and the batch landing 47
          # of them took 6981ms, past the five seconds Android calls
          # unresponsive. The test blocks the main thread for real.
          guard_godot tools/test_preload_batch_backoff.gd

          # === Verify the precache sweep is driven by the reveal, not the clock
          # An AnimationPlayer advances by delta, so the 0.8s sweep ends in four
          # or five frames while the reveal it is meant to accompany takes 6737ms
          # on Chimera. Everything revealed after that was drawn from one fixed
          # pose - the file's own diagnosis, left half-fixed by 67c9fad. The
          # poses are re-served per revealing frame now; this pins that they are
          # collected, that they cycle, that a scene without a sweep still loads,
          # and that nothing is served while the animation still owns the
          # transform.
          guard_godot tools/test_preload_sweep.gd

          # === Verify the precache sweep also visits the stalling cutscenes
          # 122_fall@6.8s still costs frame=1911.7ms for spec+8 with RAM/VRAM
          # flat - a pipeline-compile stall, not loading. Three more sequences
          # show the same shape. All four are shots the precache's own sweep
          # never visited, because that sweep only cycles through the
          # viewpoints its own animation authors - a mesh can be
          # visible=true the whole loading screen and never get drawn if the
          # camera never points at it, and an undrawn material never
          # compiles. extra_sweep_animations folds each sequence's own camera
          # track into the cycling sweep. Unverified on device - it changes
          # which frame a pipeline first compiles on, not whether it does; a
          # fresh log's pipe= on these four sequences is what confirms it.
          guard_godot tools/test_preload_extra_sweep.gd

          # === Verify the cached hit order matches the sorted one
          # update_performance() rebuilt and re-sorted every result hit so far
          # once per note that lands - O(n log n) per note. Monochrome's log
          # measured the lanes' _process growing 1.0ms -> 19.9ms across one
          # run. The array is kept now, which is only safe because it holds
          # order and never values, so this compares it against the old
          # build-and-sort at every step of a run with misses, holds and a
          # rewind in it.
          guard_godot tools/test_perf_order_cache.gd

          # === Verify one symbol's frame does not rebuild the whole atlas
          # use_backbuffer_cache and backbuffer_cache used to live on the
          # AnimateAtlas, which every symbol naming that folder shares. One
          # symbol advancing a frame cleared the flag for all of them and sent
          # the lot down the full rebuild path - Monochrome measured 480
          # rebuilds in a second against 1665 cached draws, anim2d 371ms/s.
          guard_godot tools/test_atlas_cache_per_symbol.gd

          # === Verify settings do not re-send unchanged shadow state
          # Every settings row calls apply_settings() on every change, and the
          # device log has each one compiling 35 pipelines with an identical
          # breakdown - surf+6 draw+13 spec+16 - so the same shaders are being
          # rebuilt. The shadow writes are the only ones in that function
          # Godot does not filter for you.
          guard_godot tools/test_settings_shadow_reapply.gd

          # === Verify the Kollectadex only renders while it is open
          # Its SubViewport is 620x464 - the same pixel count as the whole
          # game at scale 0.50 - and the device log has it rendering in 62 of
          # 78 shop samples for a book that is open almost none of that time.
          # It has to survive the closing animation, and it has to paint one
          # frame at startup or the prop's screen in the room is blank.
          guard_godot tools/test_kollectadex_render_gate.gd

          # === Verify the results screen idles transparent
          # It sits on a CanvasLayer at 65 for the whole song, and its `show`
          # animation starts both full-screen layers at alpha 0. Vingette had
          # no modulate at all - so white, full alpha - and every song was
          # played under a vignette darkening the edges by up to 58.8%.
          guard_python tools/audit_results_screen_idle.py

          # === Verify every lightmap bake finds its texture by path
          # A .lmbake stores its texture as a UID plus a plain res:// path.
          # Export-time UID resolution in this project fails broadly - 84d99d5
          # counted ~1300 invalid-UID warnings across ~227 files in one export
          # step - so on the APK that "fallback" path is the path that loads.
          # e191f1e deleted both bakes' texture files as orphans; the shop's
          # threw and was restored the same night, Chimera's did not throw
          # (a LightmapGI with no texture is a legal LightmapGI) and the house
          # rendered with no baked light for eleven days.
          guard_python tools/audit_lightmap_fallback_paths.py

          # === Verify no scene describes a node twice
          # An override block for an instanced scene's child is added by name
          # and parent, and adding a second instead of editing the first still
          # loads: Godot applies both in order and the result is whichever
          # properties the later one sets over what the earlier one left. This
          # shipped once, and the diff for it reads as an ordinary addition
          # thousands of lines from the block it duplicates.
          guard_python tools/audit_duplicate_scene_nodes.py

          # === Verify the log reports the real render scale
          # Both places printing it read the setting, not the viewport.
          # settings.gd applies it as window.scaling_3d_scale, so anything that
          # resets that leaves the log printing 0.50 over a full-size render -
          # and 1600x720 against 800x360 is four times the pixels.
          guard_godot tools/test_render_scale_report.gd

          # === Verify warming a voiceline does not cost a frame
          # The shop warms one voiceline per frame from _process. It used to
          # do that with a blocking load(), which moved 109 .ogg files off the
          # cold load and into gameplay one stall at a time - the device log's
          # two worst script frames in the shop are 111.47ms and 71.90ms, both
          # with every note field and anim2d at zero.
          guard_godot tools/test_voiceline_warm_async.gd

          # === Verify the dependency cost breakdown groups and ranks
          # The shop opens 397 files in 17.9s where Monochrome opens 197 in
          # 4.2s with more megabytes, so the load cost is per file. console.tscn
          # is 97 of the shop's 397 and the log shows the console not switching
          # on until 3.5s after the scene is up - this is what would confirm
          # that on the device before anyone refactors it out.
          guard_godot tools/test_dep_breakdown.gd

          # === Verify the loading bar advances when the engine's figure does not
          # load_threaded_get_status' fraction sits between 48.6% and 50.0%
          # for every one of the eight stalls in the last device log; Chimera
          # reads 48.6% at three seconds and 49.9% at twenty-six. The bar is
          # blended with a count of cached dependencies so it moves. The test
          # holds the loaded references, because a discarded load leaves the
          # cache immediately and would measure nothing.
          guard_godot tools/test_load_progress.gd

          # === Verify the console's boot flag always clears
          # booting gates back_out, home_button, gallery_button and
          # cartridges_enter_label, and its only clear used to require a frame
          # landing between 13.34s and the end of the boot animation. A frame
          # that steps over that window strands it true for the life of the
          # scene and the whole console stops responding. This project has
          # frames seconds long.
          guard_godot tools/test_console_boot_flag.gd

          # === Verify a blackout shorter than the census is still logged
          # The census names a full-screen black rect when it sees one, but it
          # samples every 30 seconds - and the reported Chimera bug is a black
          # graphic that comes and goes during a song. A 40 second visit
          # produced two censuses, both reading opaque=[], while the player
          # was watching it happen. The instrument was asleep, not wrong.
          guard_godot tools/test_blackout_watch.gd

          # === Verify the frame timer measures the frame
          # Godot's process delta is smoothed and clamped: measured against
          # this build, a 5000ms frame arrives as 66.7ms. Every frame-shape
          # number the log produces was shaped from it, which is how a device
          # log came back reporting worst=166.7ms for a session containing a
          # measured 11,489ms frame. The test blocks the thread, because delta
          # is accurate at 60fps - exactly when nobody needs it to be.
          guard_godot tools/test_frame_clock.gd

          # === Verify gpu= admits when the driver does not answer
          # viewport_get_measured_render_time_gpu returns 0.00 forever on some
          # drivers - the moto g(60)s (Mali-G76, driver 1.1.131) does it for
          # all 492 entries of one log, with cpu_render varying normally next
          # to it. A zero reads as a free frame, which is the opposite of the
          # truth, and every cross-device comparison in this project leans on
          # gpu=. The discriminator is the pair, not the lone zero: across the
          # project's 33 logs the longest run of (gpu == 0 and cpu_render > 0)
          # is 492 on that device and 0 on the other five models.
          guard_godot tools/test_gpu_timing_latch.gd

          # === Verify the trance-shader gate cannot hide anything visible
          # Safety Lullaby's WaterEffect and RadialEffect are full-screen
          # ColorRects on hint_screen_texture, and both shaders have an
          # identity branch that is their default state - the parameters all
          # come from (100 - retention)/100, which is 0 while the player holds
          # the pendulum. Measured on the phone's path (Vulkan, Forward
          # Mobile): the identity pass costs 13.3ms of a 20ms frame, three
          # times everything under it, and hiding the rect takes the engine's
          # backbuffer copy with it (draws 2 -> 1). The gate cuts at
          # NEUTRAL_EPSILON; this pins that constant under the half-a-step
          # bound its own derivation gives (0.0071), which is the part that
          # can drift in silence.
          guard_godot tools/test_trance_gate.gd

          # === Verify Reduce Visual Effects reaches a mesh-resource material
          # The stripper read material_override and the surface overrides -
          # both node-owned - and never the material set on the mesh resource.
          # Chimera's Ray box is exactly that, carrying shd_godrays: unshaded,
          # blend_add, cull_disabled, depth_test_disabled, so both faces are
          # rasterised with no depth rejection and a depth-texture sample per
          # fragment. Measured at 800x360 (the g53's 3D pass at scale=0.50):
          # one extra draw call and twelve primitives take 3.88ms to 8.05ms.
          # Inert on all four presets - only Custom with post=High reaches it -
          # so this is a correctness gate, not a win.
          guard_godot tools/test_effect_mesh_hide.gd

          # === Verify the light-energy gate and its audit tool's default
          # Forward Mobile evaluates every light that reaches a fragment, so a
          # light at energy=0 still costs full price and only visible=false
          # removes it. This gate is opt-in per node (attaching it needs a
          # human to check tools/audit_light_cost.py first, not an automatic
          # scene-wide pass) - what this pins is the gate's own behaviour and
          # a real bug the audit tool had: it read a missing light_energy
          # property line as 0.0, when Godot's own default is 1.0, and flagged
          # an ordinary light (the shop's LightbulbLight) as dead cost.
          guard_godot tools/test_light_energy_gate.gd

          # === Verify the retained-resource sweep stays cheap
          # The sweep runs on the main thread during a load, next to a loading
          # screen this project spent real effort keeping animated. Its first
          # version treated a directory listing as free inside a budgeted loop
          # and blew 2ms to 358ms in one frame - destroying the thing it was
          # added to explain. The bound is checked against the real project,
          # not a fixture.
          guard_godot tools/test_retained_sweep.gd

          # === Verify the UI localization CSV resolves and falls back correctly
          # Godot auto-translates a Control's text/tooltip against whatever
          # TranslationServer.set_locale() is set to, keyed on the literal
          # English string authored in the .tscn - so the CSV at
          # lullaby_mod/resources/localization/ui_strings.csv never needed a
          # single .tscn edited, only an "es" column. This pins that the
          # generated ui_strings.es.translation actually loads (project.godot
          # points at the .translation, not the source .csv - pointing at the
          # .csv silently loads nothing), that known keys resolve under "es",
          # and that locale "en" (or any locale with no translation) falls
          # straight back to the authored English text rather than erroring.
          guard_godot tools/test_localization.gd

          # === Verify the Codes home icon still changes colour when selected
          # The kind of bug a test normally misses: the button was wired
          # correctly and did swap materials on focus - the two materials just
          # looked the same. Every other icon swaps between two different
          # gradient textures (grey-beige vs a white-to-red ramp); the keyboard
          # icon is a flat quad with its own texture, and its "selected"
          # material was that same texture at albedo_color 1.3 - a brightness
          # bump with no hue shift, so the icon read as dead when focused.
          # This pins that idle and select differ by a real shift toward red.
          guard_godot tools/test_console_icon_select_tint.gd

          # === Verify the three Training drills are actually playable
          # Each mechanic is normally driven by its own song's scene animation
          # and the Training host only replaced part of what that animation
          # does, so all three built cleanly and none of them worked: the
          # pendulum was never revealed (the song drives `dropped` as well as
          # `started`), the heart sat at (0,0) with its ECG line off-screen,
          # and the typing challenge kept its authored time_end = 0.0, which
          # makes both of its entry points return on their own deadline guard
          # - no word, no unowns, no timer. On top of that the test level's
          # only touch node is a bare Control, so nothing on a phone produced
          # the `lullaby_special` two of them read, and typing had no keyboard.
          # None of that is visible to a parse check or to either scene sweep;
          # every one of them is a value a script has to write at runtime.
          guard_godot tools/test_training_setup.gd

          # === Verify hardcoded uid:// references resolve
          # Catches the collector-shop crash class before it ships: a bare
          # "uid://..." string literal in .gd code (SceneChanger.change_to,
          # preload, change_scene_to_file - no res:// path to fall back to,
          # unlike a normal ext_resource) that doesn't resolve against
          # .godot/uid_cache.bin. This has shipped silently before because
          # nothing checked it - the Import step's own log stays clean even
          # when this is broken, and it only surfaces as a runtime crash on
          # whatever menu action actually triggers that specific reference.
          # See tools/verify_hardcoded_uids.gd for what this doesn't catch
          # (ext_resource uid mismatches - those degrade gracefully to a
          # text-path fallback instead of crashing, so they're a quality
          # issue, not a build-breaking one).
          guard_godot tools/verify_hardcoded_uids.gd --no-path
          if [ ${#failed[@]} -ne 0 ]; then
            echo
            echo "::error::${#failed[@]} guard(s) failed:"
            for f in "${failed[@]}"; do echo "::error::  $f"; done
            exit 1
          fi
          echo
          echo "all $ran guards passed"

      - name: Create builds directory
        run: |
          mkdir -p builds

      - name: Bump Android version code
        run: |
          # version/code must strictly increase for Android to accept an APK
          # as a valid update over whatever is already installed (a build
          # signed identically but with an equal/lower versionCode fails with
          # INSTALL_FAILED_VERSION_DOWNGRADE unless the installer passes -d).
          # The workflow run number always increases run over run, so it's a
          # simple monotonic source - offset it well above the manually-set
          # value in export_presets.cfg so it never collides with it.
          NEW_CODE=$((10000 + ${{ github.run_number }}))
          sed -i "s/^version\/code=.*/version\/code=${NEW_CODE}/" export_presets.cfg
          echo "version/code set to ${NEW_CODE}"

          # And stamp the same build into project.godot, which is a different
          # file: the diagnostics log reads application/config/version out of
          # ProjectSettings, and nothing had ever written it, so every log
          # header has said "version : code ?" since the log existed. That
          # cost real time - a log was read as evidence about a build it did
          # not come from, because nothing in it said otherwise.
          #
          # Not committed: this runs after the harvest step, and that step
          # only ever stages precompiled_astc_imports.
          python3 - "$NEW_CODE" "${{ github.sha }}" <<'PY'
          import re, sys

          code, sha = sys.argv[1], sys.argv[2][:8]
          stamp = "%s-%s" % (code, sha)
          text = open("project.godot", encoding="utf-8").read()

          line = 'config/version="%s"\n' % stamp
          if re.search(r'^config/version=', text, re.M):
              text = re.sub(r'^config/version=.*\n', line, text, count=1, flags=re.M)
          else:
              # Straight after config/name, which every project.godot has.
              text = re.sub(r'^(config/name=.*\n)', r'\1' + line, text, count=1, flags=re.M)

          open("project.godot", "w", encoding="utf-8").write(text)
          print("application/config/version set to %s" % stamp)
          PY

      - name: Build Android APK
        id: build
        run: |
          # Which engine template goes in the APK, which is a different
          # question from which key signs it. Every build this project has
          # ever shipped used --export-debug and was then re-signed with the
          # release keystore, so the APK on the tester's phone has been a
          # debug engine wearing a release signature.
          #
          # That is not free. A debug template compiles in DEBUG_ENABLED, the
          # remote debugger and the profiler, and - the part that matters
          # here - runs GDScript with its per-instruction debug bookkeeping
          # for line numbers and stack traces. This project's two unexplained
          # costs are both of that shape: Monochrome's script_max sits at
          # 19.5ms median and 80.9ms worst with no subsystem accounting for
          # more than ~3ms of it, and seven of the shop's spikes are 50-150ms
          # frames where gpu, script, cpu_render and phys together sum to 26.
          #
          # So this is worth an A/B rather than a switch flipped on faith.
          # Both are kept, release is the default, and the two are directly
          # comparable because the same keystore signs both.
          #
          # package/signed=false on the release preset on purpose: Godot
          # refuses to export release with signing on unless the preset
          # carries keystore/release credentials ("Could not find release
          # keystore, unable to export"), and putting the key in the preset
          # is worse than leaving apksigner to do it from the secret, which
          # is what already keeps every build installable over the last one.
          BUILD_TYPE="${{ inputs.build_type }}"
          BUILD_TYPE="${BUILD_TYPE:-release}"

          if [ "$BUILD_TYPE" = "debug" ]; then
            PRESET="Android Debug"; FLAG="--export-debug"; OUT="builds/android_debug.apk"
          else
            PRESET="Android Release"; FLAG="--export-release"; OUT="builds/android_release.apk"
          fi
          echo "Exporting preset '$PRESET' with $FLAG"

          $GODOT --headless $FLAG "$PRESET" "$OUT" 2>&1

          if [ -f "$OUT" ]; then
            echo "APK_SIZE=$(du -h "$OUT" | cut -f1)" >> $GITHUB_OUTPUT
            echo "apk_path=$OUT" >> $GITHUB_OUTPUT
            echo "build_type=$BUILD_TYPE" >> $GITHUB_OUTPUT
            echo "build_success=true" >> $GITHUB_OUTPUT
          else
            echo "build_success=false" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: Sign APK with Release Keystore
        if: steps.build.outputs.build_success == 'true'
        run: |
          $ANDROID_HOME/build-tools/${{ env.ANDROID_BUILD_TOOLS }}/apksigner sign \
            --ks ~/.android/release.keystore \
            --ks-pass pass:${{ secrets.KEYSTORE_PASSWORD }} \
            --key-pass pass:${{ secrets.KEY_PASSWORD }} \
            --ks-key-alias ${{ secrets.KEY_ALIAS }} \
            --out builds/rubicon-release.apk \
            "${{ steps.build.outputs.apk_path }}"

          echo "Signed APK: builds/rubicon-release.apk"
          ls -lh builds/

      - name: Upload APK artifact
        if: steps.build.outputs.build_success == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: rubicon-fnfr-android-release
          path: builds/rubicon-release.apk
          retention-days: 3
          compression-level: 9

      - name: Upload debug symbols
        if: steps.build.outputs.build_success == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: rubicon-fnfr-android-debug-symbols
          path: |
            builds/*.apk.idsig
          retention-days: 3

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      apk_size: ${{ needs.build.outputs.apk_size }}

    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: rubicon-fnfr-android-release
          path: .

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          files: rubicon-release.apk
          generate_release_notes: true
          prerelease: ${{ !contains(github.ref, '-rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  check:
    name: Build Check
    runs-on: ubuntu-latest
    steps:
      # No LFS at all. This job runs four `test -f` over project.godot,
      # export_presets.cfg, an addon directory and build.sh - not one of them
      # is LFS-tracked - and it was pulling ~398MB of precompiled imports to
      # do it, on every run, against a 1GB monthly allowance.
      - name: Checkout
        uses: actions/checkout@v4
        env:
          GIT_LFS_SKIP_SMUDGE: 1
        with:
          lfs: false
          sparse-checkout: |
            /*
            !/lullaby_mod/original_pck/
          sparse-checkout-cone-mode: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify project structure
        run: |
          echo "Checking project files..."
          test -f project.godot && echo "✓ project.godot exists"
          test -f export_presets.cfg && echo "✓ export_presets.cfg exists"
          test -d addons/rubicon_mobile_controls && echo "✓ rubicon_mobile_controls addon exists"
          test -f build.sh && echo "✓ build.sh exists"
          echo ""
          echo "Project structure verified!"
