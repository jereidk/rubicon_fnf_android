[plugin]

name="ASTC Sprite Importer (12x12 exhaustive)"
description="Imports large flat-shaded 2D sprites/backgrounds as ASTC 12x12 at exhaustive quality via a standalone astcenc invocation. Verified by direct visual A/B comparison against real project art (see tools/astc_compress/). Not for pixel art, fonts, icons, or normal maps - those need smaller blocks or are excluded entirely."
author="lullaby_mod"
version="1.0"
script="plugin.gd"
